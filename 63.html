  $('defaults').addEventListener('click',safeAction(async()=>{if(!confirm('将当前文字和布局套用最新默认？\n已上传的图片与图片取景位置会保留。'))return;snapshot();const crops=new Map(proj.elements.filter(e=>e.type==='image').map(e=>[e.id,{px:e.px??50,py:e.py??50,zoom:e.zoom??1}]));proj.elements=clone(TEMPLATE.elements);for(const e of proj.elements)if(crops.has(e.id))Object.assign(e,crops.get(e.id));proj.background=TEMPLATE.background;proj.updated=Date.now();buildElementList();buildPanel();buildBackground();requestRender();await saveNow();}));
  function undo(){if(busy||!undoStack.length)return;proj=undoStack.pop();lastSnapshot=0;$('undo').disabled=!undoStack.length;$('project-name').value=proj.name;buildElementList();buildPanel();buildBackground();requestRender();scheduleSave();}
  $('undo').addEventListener('click',undo);document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'&&!event.shiftKey&&!event.isComposing&&!_imeOn){event.preventDefault();undo();}if(event.key==='Escape')closePicker();});
  $('backup').addEventListener('click',safeAction(backup));$('import').addEventListener('click',()=>{if(!busy)$('import-file').click();});
  $('import-file').addEventListener('change',safeAction(async()=>{const file=$('import-file').files[0];if(!file)return;const state=sanitizeImport(JSON.parse(await file.text()));await ensureFonts(state);for(const [id,src]of Object.entries(state.photos))await decodePhoto(src,id);for(const e of state.elements.filter(e=>e.type==='artwork'&&e.customArtwork))await decodePhoto(e.src,e.id);await saveNow();proj=state;refreshAfterLoad();await saveNow();status(Object.keys(state.photos).length?'项目已导入，图片、文字与字体均已保留':'参数已导入，请添加图片');$('import-file').value='';}));
  $('reference').addEventListener('click',()=>{if(TEMPLATE.referenceDataUrl)$('reference-dialog').showModal();else status('当前单文件未包含原参考图',true);});$('close-reference').addEventListener('click',()=>$('reference-dialog').close());
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&proj)saveNow().catch(()=>{});});

  function describe(){return {version:'1.0.0',templateId:TEMPLATE.id,name:TEMPLATE.name,role:TEMPLATE.role,size:{width:1200,height:1600},mode:'new-project',textAliases:Object.fromEntries(TEMPLATE.elements.filter(e=>e.type==='text').map(e=>[e.id,e.id])),nativeTextKeys:TEMPLATE.elements.filter(e=>e.type==='text').map(e=>e.id),images:TEMPLATE.elements.filter(e=>e.type==='image').map(e=>({key:e.id,slot:e.id,label:e.label||e.id,x:e.x,y:e.y,w:e.w,h:e.h,opt:false})),crop:{zoom:'0.5–3',x:'0–100，0左/100右',y:'0–100，0上/100下'},fonts:clone(availableWeights()),fixedArtworkTexts:clone(TEMPLATE.fixedArtworkTexts||[]),status:'technical-adapter; visual-review-required'};}
  function plan(task){
    if(!task||typeof task!=='object'||Array.isArray(task))throw error('INVALID_TASK','任务必须是对象');
    for(const key of Object.keys(task))if(!['templateId','name','store','hall','texts','nativeTexts','images','font'].includes(key))throw error('UNKNOWN_FIELD','未知任务字段：'+key);
    if(Number(task.templateId)!==Number(TEMPLATE.id))throw error('TEMPLATE_MISMATCH','模板编号不匹配');
    if(typeof task.name!=='string'||!task.name.trim())throw error('MISSING_METADATA','缺少项目名称 name');
    for(const key of ['store','hall'])if(task[key]!=null&&typeof task[key]!=='string')throw error('INVALID_METADATA',key+' 必须是字符串');
    if(task.font!=null&&!Object.hasOwn(availableWeights(),task.font))throw error('INVALID_FONT','font 须使用 describe().fonts 中的字体键');
    const state=newState(task.name,false),known=new Map(state.elements.map(e=>[e.id,e]));
    for(const e of state.elements)if(e.type==='text'){e.text='';if(task.font){e.font=task.font;if(!weights[e.font].includes(e.weight))e.weight=weights[e.font][0];}}
    const assigned=new Set();for(const source of ['texts','nativeTexts']){const values=task[source]||{};if(!values||typeof values!=='object'||Array.isArray(values))throw error('INVALID_TEXTS',source+' 必须是对象');for(const [id,value] of Object.entries(values)){const e=known.get(id);if(!e||e.type!=='text')throw error('UNSUPPORTED_TEXT','没有此文字字段：'+id);if(assigned.has(id))throw error('DUPLICATE_TEXT','文字重复赋值：'+id);if(typeof value!=='string')throw error('INVALID_TEXT','文字必须为字符串：'+id);e.text=value;assigned.add(id);}}
    const images=task.images??[];if(!Array.isArray(images))throw error('INVALID_IMAGES','images 必须是图片数组');const seen=new Set();
    for(const img of images){if(!img||typeof img!=='object')throw error('INVALID_IMAGE','图片条目无效');for(const k of Object.keys(img))if(!['slot','src','x','y','zoom','store','hall','subject','assetId'].includes(k))throw error('UNKNOWN_IMAGE_FIELD','未知图片字段：'+k);const e=known.get(img.slot);if(!e||e.type!=='image')throw error('UNKNOWN_SLOT','没有此图位：'+img.slot);if(seen.has(img.slot))throw error('DUPLICATE_SLOT','重复图位：'+img.slot);seen.add(img.slot);photoInputValid(img.src,img.slot);for(const [k,min,max] of [['x',0,100],['y',0,100],['zoom',.5,3]])if(img[k]!=null&&(!Number.isFinite(img[k])||img[k]<min||img[k]>max))throw error('INVALID_CROP','图片裁切超出范围：'+img.slot+'.'+k);e.px=img.x??50;e.py=img.y??50;e.zoom=img.zoom??1;state.photos[img.slot]=img.src;}
    state.metadata={store:task.store||'',hall:task.hall||'',source:'posterAutomation',images:images.map(({src,...metadata})=>metadata)};
    return {state,images};
  }
  async function reportState(state){await ensureFonts(state);await document.fonts.ready;const result=await R.validate(state);const issues=[...(result.issues||[])];for(const e of state.elements.filter(e=>e.type==='image'))if(!state.photos[e.id]&&!issues.some(i=>i.code==='MISSING_IMAGE'&&(i.slot===e.id||i.field===e.id)))issues.push({code:'MISSING_IMAGE',slot:e.id,message:'图位尚未上传图片'});return {...result,ok:result.ok!==false&&issues.length===0,issues,reviewRequired:true};}
  async function preflight(task){await ready();const p=plan(task);return {...await reportState(p.state),imagesDecoded:false,note:'检查任务结构、文字与图位；apply 将验证每张图片的实际解码'};}
  async function apply(task){
    await ready();if(busy)throw error('BUSY','上一任务尚未完成');setBusy(true);
    try{const p=plan(task);const checks=await reportState(p.state);if(!checks.ok)throw error('VALIDATION_FAILED',JSON.stringify(checks.issues));const prepared=[];for(const img of p.images)prepared.push({...img,...await decodePhoto(img.src,img.slot)});await saveNow();proj=p.state;lastTask={...clone(task),images:task.images.map(({src,...metadata})=>metadata)};refreshAfterLoad();await requestRender();await saveNow();const warnings=[...(TEMPLATE.fixedArtworkTexts?.length?[{code:'FIXED_ARTWORK_TEXT',message:'原字图片内容固定，正式使用前核对原文是否适用',texts:TEMPLATE.fixedArtworkTexts.map(e=>e.originalText)}]:[]),{code:'VISUAL_REVIEW',message:'需检查主体、人物完整度及当前门店事实'}];const sources=new Map();for(const image of prepared){if(sources.has(image.src))warnings.push({code:'DUPLICATE_SOURCE',slot:image.slot,other:sources.get(image.src)});sources.set(image.src,image.slot);const e=proj.elements.find(e=>e.id===image.slot),ratio=(image.w/image.h)/(e.w/e.h);if(Math.min(ratio,1/ratio)<.55)warnings.push({code:'HEAVY_CROP',slot:image.slot,message:'图位与原图比例差异较大，请核对主体保留情况'});}return {ok:true,templateId:TEMPLATE.id,projectId:proj.id,warnings,reviewRequired:true};}
    finally{setBusy(false);}
  }
  async function validate(){await ready();return {...await reportState(proj),lastTask:clone(lastTask)};}
  async function exportPNG(options={}){
    await ready();if(busy)throw error('BUSY','正在处理上一任务');setBusy(true);
    try{await document.fonts.ready;const check=await reportState(proj);if(!check.ok)throw error('VALIDATION_FAILED',JSON.stringify(check.issues));await requestRender();const output=document.createElement('canvas');output.width=1200;output.height=1600;await R.render(output,projectCopy(proj));await document.fonts.ready;const blob=await new Promise((resolve,reject)=>output.toBlob(b=>b?resolve(b):reject(error('EXPORT_FAILED','PNG编码失败')),'image/png'));if(!await wpCheckExportQuota())throw error('QUOTA_DENIED','当前卡密不能导出');const name=typeof options==='string'?options:options.filename||filename(proj.name,'.png');download(blob,name.endsWith('.png')?name:name+'.png');status('已请求下载 1200 × 1600 PNG');return {requested:true,templateId:TEMPLATE.id,projectId:proj.id,width:1200,height:1600,note:'实际完成以浏览器下载事件为准'};}
    finally{setBusy(false);}
  }
  $('export').addEventListener('click',safeAction(()=>exportPNG()));
  const initPromise=(async()=>{if(!await wpCheckAuth())throw error('AUTH_REQUIRED','请先登录后使用模板');db=await openDB();const revisionKey=DB_NAME+'-default-revision',newRevision=TEMPLATE.revision&&localStorage.getItem(revisionKey)!==TEMPLATE.revision;let loaded=false;if(newRevision){proj=newState('参考排版示例 · 校准版');refreshAfterLoad();await saveNow();localStorage.setItem(revisionKey,TEMPLATE.revision);loaded=true;}else{const active=localStorage.getItem(DB_NAME+'-active');loaded=active&&await loadProject(active);if(!loaded){const all=(await dbAll('meta')).sort((a,b)=>b.updated-a.updated);if(all.length)loaded=await loadProject(all[0].id);}}if(!loaded){proj=newState('参考排版示例');refreshAfterLoad();await saveNow();}await document.fonts.ready;await requestRender();window.__posterTemplateReady=true;return true;})();
  initPromise.catch(e=>status('初始化失败：'+e.message,true));
  function ready(){return initPromise;}
  window.posterAutomation=Object.freeze({version:'1.0.0',ready,describe,preflight,apply,validate,exportPNG});
  window.wpCheckAuth=wpCheckAuth;window.wpCheckExportQuota=wpCheckExportQuota;
})();
</script>
