    const patches=state.jinheCopyRevision===update.incrementalFrom?update.incrementalPatches:update.patches;

  async function apply(task){

    try{await hydrateJinheAssets(TEMPLATE.elements);const p=plan(task);const checks=await reportState(p.state);if(!checks.ok)throw error('VALIDATION_FAILED',JSON.stringify(checks.issues));const prepared=[];for(const img of p.images)prepared.push({...img,...await decodePhoto(img.src,img.slot)});await saveNow();proj=p.state;lastTask={...clone(task),images:task.images.map(({src,...metadata})=>metadata)};refreshAfterLoad();await requestRender();await saveNow();const warnings=[...(TEMPLATE.fixedArtworkTexts?.length?[{code:'FIXED_ARTWORK_TEXT',message:'原字图片内容固定，正式使用前核对原文是否适用',texts:TEMPLATE.fixedArtworkTexts.map(e=>e.originalText)}]:[]),{code:'VISUAL_REVIEW',message:'需检查主体、人物完整度及当前门店事实'}];const sources=new Map();for(const image of prepared){if(sources.has(image.src))warnings.push({code:'DUPLICATE_SOURCE',slot:image.slot,other:sources.get(image.src)});sources.set(image.src,image.slot);const e=proj.elements.find(e=>e.id===image.slot),ratio=(image.w/image.h)/(e.w/e.h);if(Math.min(ratio,1/ratio)<.55)warnings.push({code:'HEAVY_CROP',slot:image.slot,message:'图位与原图比例差异较大，请核对主体保留情况'});}return {ok:true,templateId:TEMPLATE.id,projectId:proj.id,warnings,reviewRequired:true};}
    finally{setBusy(false);}
  }
  async function validate(){await ready();return {...await reportState(proj),lastTask:clone(lastTask)};}
  async function exportPNG(options={}){
    await ready();if(busy)throw error('BUSY','正在处理上一任务');setBusy(true);
    try{await document.fonts.ready;const check=await reportState(proj);if(!check.ok)throw error('VALIDATION_FAILED',JSON.stringify(check.issues));await requestRender();const output=document.createElement('canvas');output.width=1200;output.height=1600;await R.render(output,projectCopy(proj));await document.fonts.ready;const blob=await new Promise((resolve,reject)=>output.toBlob(b=>b?resolve(b):reject(error('EXPORT_FAILED','PNG编码失败')),'image/png'));if(!await wpCheckExportQuota())throw error('QUOTA_DENIED','当前卡密不能导出');const name=typeof options==='string'?options:options.filename||filename(proj.name,'.png');download(blob,name.endsWith('.png')?name:name+'.png');status('已请求下载 1200 × 1600 PNG');return {requested:true,templateId:TEMPLATE.id,projectId:proj.id,width:1200,height:1600,note:'实际完成以浏览器下载事件为准'};}
    finally{setBusy(false);}
  }
  $('export').addEventListener('click',safeAction(()=>exportPNG()));

  const jinheAssetData=new Map();
  async function hydrateJinheAssets(target=TEMPLATE){
    const allowed=new Set(window.JINHE_STATIC_ASSETS||[]),needed=new Set();
    function collect(value){
      if(typeof value==='string'){if(allowed.has(value))needed.add(value);}
      else if(Array.isArray(value)){for(const item of value)collect(item);}
      else if(value&&typeof value==='object'){for(const item of Object.values(value))collect(item);}
    }
    collect(target);
    if(!needed.size)return target;
    const pairs=await Promise.all([...needed].map(async url=>{
      if(!jinheAssetData.has(url)){
        const pending=(async()=>{
          const absolute=new URL(url,location.href);
          if(absolute.origin!==location.origin)throw error('ASSET_ORIGIN','图片来源无效');
          const response=await fetch(absolute.href,{cache:'force-cache'});
          if(!response.ok)throw error('ASSET_LOAD','图片载入失败，请刷新重试');
          return await blobData(await response.blob());
        })();
        jinheAssetData.set(url,pending);
        pending.catch(()=>{if(jinheAssetData.get(url)===pending)jinheAssetData.delete(url);});
      }
      return [url,await jinheAssetData.get(url)];
    }));
    const values=new Map(pairs);
    function walk(value){
      if(typeof value==='string')return values.get(value)||value;
      if(Array.isArray(value))return value.map(walk);
      if(value&&typeof value==='object'){for(const k of Object.keys(value))value[k]=walk(value[k]);}
      return value;
    }
    return walk(target);
  }
  async function newDefaultState(name){await hydrateJinheAssets();return newState(name);}
  const initPromise=(async()=>{
    if(!await wpCheckAuth())throw error('AUTH_REQUIRED','请先登录后使用模板');
    status('正在载入锦禾封面…');
    db=await openDB();
    let loaded=false;
    const active=localStorage.getItem(DB_NAME+'-active');
    loaded=active&&await loadProject(active);
    if(!loaded){const all=(await dbAll('meta')).sort((a,b)=>b.updated-a.updated);if(all.length)loaded=await loadProject(all[0].id);}
    if(!loaded){proj=await newDefaultState('锦禾 · '+TEMPLATE.id+'号封面');refreshAfterLoad();await saveNow();}
    await document.fonts.ready;await requestRender();
    status('已自动保存在此浏览器');window.__posterTemplateReady=true;return true;
  })();
  initPromise.catch(e=>status('初始化失败：'+e.message,true));
  function ready(){return initPromise;}
  window.posterAutomation=Object.freeze({version:'1.0.0',ready,describe,preflight,apply,validate,exportPNG});
  window.wpCheckAuth=wpCheckAuth;window.wpCheckExportQuota=wpCheckExportQuota;
})();
</script></body></html>
