  function sanitizeImport(input){
    let p=clone(input?.project||input);if(Number(input?.templateId??p?.templateId)!==Number(TEMPLATE.id))throw error('TEMPLATE_MISMATCH','备份属于其他模板');if(!Array.isArray(p.elements))throw error('INVALID_BACKUP','备份内容无效');const knownIds=new Set(TEMPLATE.elements.map(e=>e.id));if(p.elements.some(e=>!knownIds.has(e.id)))throw error('INVALID_BACKUP','备份含不属于此模板的内容');p=upgradeArtwork(p);if(p.elements.length!==TEMPLATE.elements.length)throw error('INVALID_BACKUP','备份图层数量不匹配');const byId=new Map(TEMPLATE.elements.map(e=>[e.id,e])),seen=new Set();
    for(const e of p.elements){const original=byId.get(e.id);if(!original||seen.has(e.id)||original.type!==e.type)throw error('INVALID_BACKUP','备份内容不匹配');seen.add(e.id);for(const v of Object.values(e))if(typeof v==='number'&&(!Number.isFinite(v)||Math.abs(v)>100000))throw error('INVALID_BACKUP','备份参数超出范围');if(e.originalArtworkVariant){const a=e.originalArtworkVariant;photoInputValid(a.src,e.id);for(const key of ['x','y','w','h','anchorX','anchorY'])if(!Number.isFinite(a[key]))throw error('INVALID_BACKUP','原字备选位置无效');if(!['editable','original'].includes(e.artworkMode))e.artworkMode='editable';}if(e.type==='artwork'){if(e.customArtwork){photoInputValid(e.src,e.id);if(!Number.isFinite(e.artworkRatio)||e.artworkRatio<=0)throw error('INVALID_BACKUP','艺术字比例无效');e.h=e.w*e.artworkRatio;}else{for(const key of ['src','asset','originalText','sourceReference','sourceRect','sourceImage','fixedContent']){if(original[key]!==undefined)e[key]=clone(original[key]);else delete e[key];}e.h=e.w*original.h/original.w;}}}
    if(!parseColor(p.background))throw error('INVALID_BACKUP','备份背景色无效');const photos={};for(const [id,src]of Object.entries(p.photos||{})){if(byId.get(id)?.type!=='image')throw error('INVALID_BACKUP','备份图片位置无效');photoInputValid(src,id);photos[id]=src;}const customFonts=p.customFonts||[];if(!Array.isArray(customFonts)||customFonts.length>100||customFonts.some(f=>!fontSourceValid(f)))throw error('INVALID_BACKUP','备份字体无效');
    return {...newState((p.name||'导入项目')+' · 导入',false),elements:p.elements,background:p.background,photos,customFonts,metadata:clone(p.metadata||{}),editableArtworkSchema:TEMPLATE.editableArtworkSchema||0,sampleSlots:(p.sampleSlots||[]).filter(id=>Object.hasOwn(photos,id))};
  }
  function safeAction(fn){return async()=>{if(busy)return;try{await fn();}catch(e){status(e.message||String(e),true);}};}

  function describe(){return {version:'1.0.0',templateId:TEMPLATE.id,name:TEMPLATE.name,role:TEMPLATE.role,size:{width:1200,height:1600},mode:'new-project',textAliases:Object.fromEntries(TEMPLATE.elements.filter(e=>e.type==='text').map(e=>[e.id,e.id])),nativeTextKeys:TEMPLATE.elements.filter(e=>e.type==='text').map(e=>e.id),images:TEMPLATE.elements.filter(e=>e.type==='image').map(e=>({key:e.id,slot:e.id,label:e.label||e.id,x:e.x,y:e.y,w:e.w,h:e.h,opt:false})),crop:{zoom:'0.5–3',x:'0–100，0左/100右',y:'0–100，0上/100下'},fonts:clone(availableWeights()),fixedArtworkTexts:clone(TEMPLATE.fixedArtworkTexts||[]),status:'technical-adapter; visual-review-required'};}
  function plan(task){
    if(!task||typeof task!=='object'||Array.isArray(task))throw error('INVALID_TASK','任务必须是对象');
    for(const key of Object.keys(task))if(!['templateId','name','store','hall','texts','nativeTexts','images','font'].includes(key))throw error('UNKNOWN_FIELD','未知任务字段：'+key);
    if(Number(task.templateId)!==Number(TEMPLATE.id))throw error('TEMPLATE_MISMATCH','模板编号不匹配');
    if(typeof task.name!=='string'||!task.name.trim())throw error('MISSING_METADATA','缺少项目名称 name');
    for(const key of ['store','hall'])if(task[key]!=null&&typeof task[key]!=='string')throw error('INVALID_METADATA',key+' 必须是字符串');
    if(task.font!=null&&!Object.hasOwn(availableWeights(),task.font))throw error('INVALID_FONT','font 须使用 describe().fonts 中的字体键');
    const state=newState(task.name,false),known=new Map(state.elements.map(e=>[e.id,e]));
    for(const e of state.elements)if(e.type==='text'){e.text='';if(task.font){e.font=task.font;if(!weights[e.font].includes(e.weight))e.weight=weights[e.font][0];}}
    const assigned=new Set();for(const source of ['texts','nativeTexts']){const values=task[source]||{};if(!values||typeof values!=='object'||Array.isArray(values))throw error('INVALID_TEXTS',source+' 必须是对象');for(const [id,value] of Object.entries(values)){const e=known.get(id);if(!e||e.type!=='text')throw error('UNSUPPORTED_TEXT','没有此文字字段：'+id);if(assigned.has(id))throw error('DUPLICATE_TEXT','文字重复赋值：'+id);if(typeof value!=='string')throw error('INVALID_TEXT','文字必须为字符串：'+id);e.text=value;assigned.add(id);}}
    const images=task.images??[];if(!Array.isArray(images))throw error('INVALID_IMAGES','images 必须是图片数组');const seen=new Set();
    for(const img of images){if(!img||typeof img!=='object')throw error('INVALID_IMAGE','图片条目无效');for(const k of Object.keys(img))if(!['slot','src','x','y','zoom','store','hall','subject','assetId'].includes(k))throw error('UNKNOWN_IMAGE_FIELD','未知图片字段：'+k);const e=known.get(img.slot);if(!e||e.type!=='image')throw error('UNKNOWN_SLOT','没有此图位：'+img.slot);if(seen.has(img.slot))throw error('DUPLICATE_SLOT','重复图位：'+img.slot);seen.add(img.slot);photoInputValid(img.src,img.slot);for(const [k,min,max] of [['x',0,100],['y',0,100],['zoom',.5,3]])if(img[k]!=null&&(!Number.isFinite(img[k])||img[k]<min||img[k]>max))throw error('INVALID_CROP','图片裁切超出范围：'+img.slot+'.'+k);e.px=img.x??50;e.py=img.y??50;e.zoom=img.zoom??1;state.photos[img.slot]=img.src;}
    state.metadata={store:task.store||'',hall:task.hall||'',source:'posterAutomation',images:images.map(({src,...metadata})=>metadata)};
    return {state,images};
  }
  async function reportState(state){await ensureFonts(state);await document.fonts.ready;const result=await R.validate(state);const issues=[...(result.issues||[])];for(const e of state.elements.filter(e=>e.type==='image'))if(!state.photos[e.id]&&!issues.some(i=>i.code==='MISSING_IMAGE'&&(i.slot===e.id||i.field===e.id)))issues.push({code:'MISSING_IMAGE',slot:e.id,message:'图位尚未上传图片'});return {...result,ok:result.ok!==false&&issues.length===0,issues,reviewRequired:true};}
  async function preflight(task){await ready();await hydrateJinheAssets(TEMPLATE.elements);const p=plan(task);return {...await reportState(p.state),imagesDecoded:false,note:'检查任务结构、文字与图位；apply 将验证每张图片的实际解码'};}
  async function apply(task){
    await ready();if(busy)throw error('BUSY','上一任务尚未完成');setBusy(true);
    try{await hydrateJinheAssets(TEMPLATE.elements);const p=plan(task);const checks=await reportState(p.state);if(!checks.ok)throw error('VALIDATION_FAILED',JSON.stringify(checks.issues));const prepared=[];for(const img of p.images)prepared.push({...img,...await decodePhoto(img.src,img.slot)});await saveNow();proj=p.state;lastTask={...clone(task),images:task.images.map(({src,...metadata})=>metadata)};refreshAfterLoad();await requestRender();await saveNow();const warnings=[...(TEMPLATE.fixedArtworkTexts?.length?[{code:'FIXED_ARTWORK_TEXT',message:'原字图片内容固定，正式使用前核对原文是否适用',texts:TEMPLATE.fixedArtworkTexts.map(e=>e.originalText)}]:[]),{code:'VISUAL_REVIEW',message:'需检查主体、人物完整度及当前门店事实'}];const sources=new Map();for(const image of prepared){if(sources.has(image.src))warnings.push({code:'DUPLICATE_SOURCE',slot:image.slot,other:sources.get(image.src)});sources.set(image.src,image.slot);const e=proj.elements.find(e=>e.id===image.slot),ratio=(image.w/image.h)/(e.w/e.h);if(Math.min(ratio,1/ratio)<.55)warnings.push({code:'HEAVY_CROP',slot:image.slot,message:'图位与原图比例差异较大，请核对主体保留情况'});}return {ok:true,templateId:TEMPLATE.id,projectId:proj.id,warnings,reviewRequired:true};}

  async function exportPNG(options={}){

    try{await document.fonts.ready;const check=await reportState(proj);if(!check.ok)throw error('VALIDATION_FAILED',JSON.stringify(check.issues));await requestRender();const output=document.createElement('canvas');output.width=1200;output.height=1600;await R.render(output,projectCopy(proj));await document.fonts.ready;const blob=await new Promise((resolve,reject)=>output.toBlob(b=>b?resolve(b):reject(error('EXPORT_FAILED','PNG编码失败')),'image/png'));if(!await wpCheckExportQuota())throw error('QUOTA_DENIED','当前卡密不能导出');const name=typeof options==='string'?options:options.filename||filename(proj.name,'.png');download(blob,name.endsWith('.png')?name:name+'.png');status('已请求下载 1200 × 1600 PNG');return {requested:true,templateId:TEMPLATE.id,projectId:proj.id,width:1200,height:1600,note:'实际完成以浏览器下载事件为准'};}

  const jinheAssetData=new Map();
  async function hydrateJinheAssets(target=TEMPLATE){
    const allowed=new Set(window.JINHE_STATIC_ASSETS||[]),needed=new Set();
    function collect(value){
      if(typeof value==='string'){if(allowed.has(value))needed.add(value);}
      else if(Array.isArray(value)){for(const item of value)collect(item);}
      else if(value&&typeof value==='object'){for(const item of Object.values(value))collect(item);}
    }
    collect(target);
    if(!needed.size)return target;
    const pairs=await Promise.all([...needed].map(async url=>{
      if(!jinheAssetData.has(url)){
        const pending=(async()=>{
          const absolute=new URL(url,location.href);
          if(absolute.origin!==location.origin)throw error('ASSET_ORIGIN','图片来源无效');
          const blob=await jinheReadImageAsset(absolute.href,'blob',{cache:'force-cache'});
          return await blobData(blob);
        })();
        jinheAssetData.set(url,pending);
        pending.catch(()=>{if(jinheAssetData.get(url)===pending)jinheAssetData.delete(url);});
      }
      return [url,await jinheAssetData.get(url)];
    }));
    const values=new Map(pairs);
    function walk(value){
      if(typeof value==='string')return values.get(value)||value;
      if(Array.isArray(value))return value.map(walk);
      if(value&&typeof value==='object'){for(const k of Object.keys(value))value[k]=walk(value[k]);}
      return value;
    }
    return walk(target);
  }
  async function newDefaultState(name){await hydrateJinheAssets();return newState(name);}

  function restoreJinheOriginalStyle(state){
    const definition=window.JINHE_ORIGINAL_STYLE;
    state.elements=(state.elements||[]).map(element=>{
      const style=definition.styles[element.id];if(!style)return element;
      const next={...element};for(const key of definition.styleKeys[element.id])delete next[key];
      return Object.assign(next,clone(style));
    });
    state.background=definition.background;
    state.jinheOriginalStyleRevision=definition.revision;
    state.jinheCopyRevision=window.JINHE_COPY_UPDATE.revision;
    state.updated=Date.now();return state;
  }

    const definition=window.JINHE_ORIGINAL_STYLE;
    const source=await newDefaultState(definition.projectName);
    const next=restoreJinheOriginalStyle(source);

  const initPromise=(async()=>{
    if(!await wpCheckAuth())throw error('AUTH_REQUIRED','请先登录后使用模板');
