/* ---------- IndexedDB ---------- */
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('jinhe-library-4-v1',1);
  r.onupgradeneeded=e=>{const db=e.target.result; if(!db.objectStoreNames.contains('projects'))db.createObjectStore('projects',{keyPath:'id',autoIncrement:true});};
  r.onsuccess=e=>{DB=e.target.result;res();}; r.onerror=()=>rej(r.error);
});}
function tx(mode){return DB.transaction('projects',mode).objectStore('projects');}
function dbAll(){return new Promise(r=>{const q=tx('readonly').getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([]);});}
function dbGet(id){return new Promise(r=>{const q=tx('readonly').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);});}
function dbPut(rec){return new Promise((resolve,reject)=>{const transaction=DB.transaction('projects','readwrite'),request=transaction.objectStore('projects').put(rec);let result;request.onsuccess=()=>{result=request.result;};transaction.oncomplete=()=>resolve(result);transaction.onerror=()=>reject(transaction.error||request.error||Error('项目保存失败'));transaction.onabort=()=>reject(transaction.error||Error('项目保存中断'));});}
function dbDel(id){return new Promise(r=>{const q=tx('readwrite').delete(id);q.onsuccess=()=>r();q.onerror=()=>r();});}
let saveT=null, savePending=Promise.resolve();
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{savePending=(async()=>{
  const rec={id:projId,name:proj.name,data:JSON.parse(JSON.stringify(proj)),imgs:imgBlobs,updated:Date.now()};
  if(projId==null){const id=await dbPut({name:proj.name,data:rec.data,imgs:imgBlobs,updated:Date.now()});projId=id;}
  else await dbPut(rec);
})();},350);}

/* ---------- 撤销 ---------- */
let _lastSnap=0;
function snapshot(){if(redoLock)return;const now=Date.now();if(undoStack.length&&now-_lastSnap<600){_lastSnap=now;return;}undoStack.push(JSON.stringify(proj));if(undoStack.length>20)undoStack.shift();_lastSnap=now;}
function undo(){if(!undoStack.length)return;const s=undoStack.pop();proj=JSON.parse(s);redoLock=true;buildPanel();render();$('projName').value=proj.name;save();redoLock=false;}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}});

/* ---------- 图片装载 ---------- */
function setImg(key,blob){
  const generation=jsonImageGeneration;
  if(imgURLs[key])URL.revokeObjectURL(imgURLs[key]);
  imgBlobs[key]=blob;
  if(!blob){imgURLs[key]=null;imgDims[key]=null;render();buildPanel();return;}
  imgURLs[key]=URL.createObjectURL(blob);
  const im=new Image();
  im.onload=()=>{if(generation!==jsonImageGeneration)return;imgDims[key]={w:im.naturalWidth,h:im.naturalHeight};render();buildPanel();};
  im.src=imgURLs[key];
}
function onImgFile(inp){const f=inp.files[0];if(!f||!uploadTarget)return;snapshot();setImg(uploadTarget,f);inp.value='';save();}
function pickImg(key){uploadTarget=key;$('imgFile').click();}

/* ---------- 几何：顶图 + 三拱槽位（预览/导出共用，1200基准） ---------- */
function archRects(){
  const a=proj.arch;
  const n=a.cols||3;                                        // 3图 / 4图
  const bw=(EXPORT_W-a.margin*2-a.gap*(n-1))/n;             // 网格单张宽
  const rects=[{x:0,y:0,w:EXPORT_W,h:a.heroH}];             // 槽0：主图（顶部通栏）
  for(let i=0;i<n;i++)rects.push({x:a.margin+i*(bw+a.gap),y:a.gridY,w:bw,h:a.gridH});
  return rects;                                             // 长度 = 1 + cols
}
/* 按钮胶囊：文字测宽（预览/导出共用同一测量） */
const _mc=document.createElement('canvas').getContext('2d');
function lineW2(text,font,weight,size,ls){_mc.font=`${weight} ${size}px ${font}`;const ch=[...String(text)];let t=0;ch.forEach((c,i)=>{t+=_mc.measureText(c).width;if(i<ch.length-1)t+=ls*size;});return t;}
function btnRect(){
  const b=proj.btn; if(!b||(!b.tL&&!b.tR))return null;
  const f="'Noto Sans SC'", w=600, ls=0.02;
  const wL=b.tL?lineW2(b.tL,f,w,b.size,ls):0;
  const wR=b.tR?lineW2(b.tR,f,w,b.size,ls):0;
  const h=b.size+b.padY*2;
  const segL=b.tL?wL+b.padX*2:0, segR=b.tR?wR+b.padX*2:0;
  const total=segL+segR, x=600-total/2;
  return{x,y:b.y,h,total,segL,segR,wL,wR,r:h/2,f,w,ls};
}
function rr(c,x,y,w,h,r){r=Math.min(r,h/2,w/2);if(c.roundRect){c.beginPath();c.roundRect(x,y,w,h,r);}else{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}}

/* 主图→背景 无缝过渡：淡出目标 = 页面渐变在该高度的真实颜色（预览/导出共用） */
function _lerpCol(a,b,t){const A=parseColor(a),B=parseColor(b);return{r:Math.round(A.r+(B.r-A.r)*t),g:Math.round(A.g+(B.g-A.g)*t),b:Math.round(A.b+(B.b-A.b)*t)};}
function pageColAt(y){return _lerpCol(proj.bgTop,proj.bgBot,Math.max(0,Math.min(1,y/EXPORT_H)));}
function heroFadeStops(){
  const a=proj.arch, gy=a.heroH*(a.gradStart==null?55:a.gradStart)/100;
  const N=6, stops=[];
  for(let k=0;k<=N;k++){
    const y=gy+(a.heroH-gy)*k/N, c=pageColAt(y);
    stops.push({p:k/N,r:c.r,g:c.g,b:c.b,a:k/N});
  }
  return{gy,end:a.heroH,stops};
}

function iLay(nW,nH,cW,cH,zoom,px,py){
  if(!nW||!nH)return{left:0,top:0,width:cW,height:cH};
  const s=Math.max(cW/nW,cH/nH)*(zoom||1);
  const rW=Math.ceil(nW*s),rH=Math.ceil(nH*s); // 向上取整：消除 cover 亚像素缝隙（右/下缘白线）
  return{left:-((px==null?50:px)/100)*Math.max(0,rW-cW),top:-((py==null?50:py)/100)*Math.max(0,rH-cH),width:rW,height:rH};
}

/* ---------- 渲染 ---------- */
function fitStage(){
  const stage=$('stage'), pad=28;
  const aw=stage.clientWidth-pad*2, ah=stage.clientHeight-pad*2;
  let w=aw, h=w*EXPORT_H/EXPORT_W; if(h>ah){h=ah;w=h*EXPORT_W/EXPORT_H;}
  $('wrap').style.width=w+'px';$('wrap').style.height=h+'px';
  const poster=$('poster');poster.style.width=w+'px';poster.style.height=h+'px';
  return w/EXPORT_W;
}
let SC=0.5;
function render(){
  SC=fitStage();
  const poster=$('poster');
  poster.innerHTML='';
  poster.style.background=`linear-gradient(180deg,${proj.bgTop},${proj.bgBot})`;
  // 主图底部无缝过渡：逐点淡到页面渐变的真实颜色（不再出现接缝）
  {const F=heroFadeStops();
   const css=F.stops.map(s=>`rgba(${s.r},${s.g},${s.b},${s.a.toFixed(3)}) ${(s.p*100).toFixed(1)}%`).join(',');
   const fd=document.createElement('div');
   fd.style.cssText=`position:absolute;left:0;top:${F.gy*SC}px;width:100%;height:${(F.end-F.gy)*SC}px;background:linear-gradient(to bottom,${css});z-index:2;pointer-events:none;`;
   poster.appendChild(fd);}
  // 双色胶囊按钮（测量与导出共用 btnRect）
  {const B=btnRect();
   if(B){const b=proj.btn;
    const cap=document.createElement('div');
    cap.style.cssText=`position:absolute;left:${B.x*SC}px;top:${B.y*SC}px;width:${B.total*SC}px;height:${B.h*SC}px;border-radius:${B.r*SC}px;overflow:hidden;display:flex;z-index:5;pointer-events:none;`;
    const mk=(w,bg,fg,tx)=>{if(!w)return null;const d=document.createElement('div');
      d.style.cssText=`width:${w*SC}px;height:100%;background:${bg};color:${fg};display:flex;align-items:center;justify-content:center;font-family:'Noto Sans SC';font-weight:600;font-size:${b.size*SC}px;letter-spacing:${B.ls*b.size*SC}px;white-space:pre;`;
      d.textContent=tx;return d;};
    const L=mk(B.segL,b.cL,b.tcL,b.tL), R=mk(B.segR,b.cR,b.tcR,b.tR);
    if(L)cap.appendChild(L); if(R)cap.appendChild(R);
    poster.appendChild(cap);}}
  // 文字
  proj.fields.forEach(f=>{
    const d=document.createElement('div');d.className='txt';
    const fs=f.size*SC;
    d.style.left=(f.x*SC)+'px';d.style.top=(f.y*SC)+'px';
    d.style.fontFamily=f.font;d.style.fontSize=fs+'px';d.style.fontWeight=f.weight;
    d.style.color=f.color;d.style.lineHeight=f.lh;
    d.style.letterSpacing=(f.ls*fs)+'px';d.style.textAlign=f.align;
    let tf='';
    if(f.align==='center')tf+='translateX(-50%) ';
    else if(f.align==='right')tf+='translateX(-100%) ';
    d.style.transform=tf.trim();
    if(f.shadow)d.style.textShadow=`0 ${4*SC}px ${16*SC}px rgba(0,0,0,0.4)`;
    d.textContent=f.text;
    poster.appendChild(d);
  });
  // 四拱形
  archRects().forEach((r,i)=>{
    const key='s'+i;
    const box=document.createElement('div');box.className='arch';
    box.style.left=(r.x*SC)+'px';box.style.top=(r.y*SC)+'px';
    box.style.width=(r.w*SC)+'px';box.style.height=(r.h*SC)+'px';
    if(i>0)box.style.borderRadius=`${(proj.arch.radius||0)*SC}px`;
    if(imgURLs[key]&&imgDims[key]){
      const s=proj.arch.slots[i];
      const L=iLay(imgDims[key].w,imgDims[key].h,r.w*SC,r.h*SC,s.zoom,s.px,s.py);
      const im=document.createElement('img');im.src=imgURLs[key];
      im.style.left=L.left+'px';im.style.top=L.top+'px';im.style.width=L.width+'px';im.style.height=L.height+'px';
      box.appendChild(im);
      box.onmousedown=e=>startDrag(i,e.clientX,e.clientY,e);
      box.addEventListener('touchstart',e=>startDrag(i,e.touches[0].clientX,e.touches[0].clientY,null),{passive:true});
    }else{
      box.classList.add('empty');box.textContent=i===0?'＋ 上传主图':'＋ 网格图'+i;
      box.onclick=()=>pickImg(key);
    }
    poster.appendChild(box);
  });
}

/* ---------- 拱形图拖动（mouse/touch 换算一致，规范 §10 规则6） ---------- */
let dragI=-1,dSX=0,dSY=0,dPX=0,dPY=0;
function startDrag(i,cx,cy,e){dragI=i;dSX=cx;dSY=cy;const s=proj.arch.slots[i];dPX=s.px;dPY=s.py;snapshot();if(e)e.preventDefault();}
function doDrag(cx,cy){
  const i=dragI;if(i<0)return;
  const r=archRects()[i], s=proj.arch.slots[i], d=imgDims['s'+i];
  if(!d)return;
  const L=iLay(d.w,d.h,r.w*SC,r.h*SC,s.zoom,50,50);
  const exW=Math.max(1,L.width-r.w*SC), exH=Math.max(1,L.height-r.h*SC);
  s.px=Math.max(0,Math.min(100,dPX-(cx-dSX)/exW*100));
  s.py=Math.max(0,Math.min(100,dPY-(cy-dSY)/exH*100));
  const pxn=$('s'+i+'px_n');if(pxn){pxn.value=Math.round(s.px);$('s'+i+'px_s').value=s.px;}
  const pyn=$('s'+i+'py_n');if(pyn){pyn.value=Math.round(s.py);$('s'+i+'py_s').value=s.py;}
  render();
}
document.addEventListener('mousemove',e=>{if(dragI>=0)doDrag(e.clientX,e.clientY);});
document.addEventListener('touchmove',e=>{if(dragI>=0)doDrag(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
document.addEventListener('mouseup',()=>{if(dragI>=0){dragI=-1;save();}});
document.addEventListener('touchend',()=>{if(dragI>=0){dragI=-1;save();}});

/* ---------- 面板 ---------- */
function sn(id,min,max,step,val,setter,pre){
  pre=pre||'';
  const call=`${setter}(${pre}+this.value)`;
  return `<div class="sn"><input type="range" id="${id}_s" min="${min}" max="${max}" step="${step}" value="${val}" oninput="${call};document.getElementById('${id}_n').value=(+this.value)"><input class="num" id="${id}_n" type="number" value="${val}" oninput="${call};document.getElementById('${id}_s').value=(+this.value)"></div>`;
}
function fontOpts(v){return FONTS.map(([n,fam])=>`<option value="${fam}" ${fam===v?'selected':''}>${n}</option>`).join('');}
function weightOpts(v){return [300,400,500,700,900].map(w=>`<option value="${w}" ${+v===w?'selected':''}>${w}</option>`).join('');}

function buildPanel(){
  const pb=$('pbody');
  const prevOpen=pb.querySelector('.sec')?new Set([...pb.querySelectorAll('.sec.open')].map(s=>s.dataset.k)):null;
  let html='';
  // 背景/整体
  html+=`<div class="sec" data-k="bg"><div class="sec-h" onclick="this.parentNode.classList.toggle('open')"><span>背景与整体</span><span class="ar">▶</span></div><div class="sec-b">
    <div class="fld"><span class="lbl">背景顶部色</span><div class="row"><div class="cd" id="cd-bgTop" style="box-shadow:inset 0 0 0 26px ${proj.bgTop};" onclick="cpOpen('@bgTop',this)"></div><input class="ti" id="ct-bgTop" value="${proj.bgTop}" oninput="setBgTop(this.value)"></div></div>
    <div class="fld"><span class="lbl">背景底部色（页面自上而下渐变）</span><div class="row"><div class="cd" id="cd-bgBot" style="box-shadow:inset 0 0 0 26px ${proj.bgBot};" onclick="cpOpen('@bgBot',this)"></div><input class="ti" id="ct-bgBot" value="${proj.bgBot}" oninput="setBgBot(this.value)"></div></div>
  </div></div>`;
  // 文字字段
  proj.fields.forEach((f,i)=>{
    const noW=SINGLE_WEIGHT.includes(f.font);
    html+=`<div class="sec" data-k="${i}"><div class="sec-h" onclick="this.parentNode.classList.toggle('open')"><span>${f.label}</span><span class="ar">▶</span></div><div class="sec-b">
      <div class="fld"><span class="lbl">文字内容</span><textarea class="ti" oncompositionstart="_imeOn=true" oncompositionend="_imeOn=false;setF(${i},'text',this.value)" oninput="if(!_imeOn)setF(${i},'text',this.value)">${f.text.replace(/</g,'&lt;')}</textarea></div>
      <div class="fld"><div class="row"><div style="flex:1.4"><span class="lbl">字体</span><select class="ti" onchange="setF(${i},'font',this.value);buildPanel()">${fontOpts(f.font)}</select></div><div style="flex:1"><span class="lbl">字重${noW?'（此字体仅1档）':''}</span><select class="ti" ${noW?'disabled':''} onchange="setF(${i},'weight',+this.value)">${weightOpts(f.weight)}</select></div></div></div>
      <div class="fld"><span class="lbl">字号</span>${sn('f'+i+'size',10,300,1,f.size,'setF',i+",'size',")}</div>
      <div class="fld"><span class="lbl">颜色</span><div class="row"><div class="cd" id="cd-f${i}" style="box-shadow:inset 0 0 0 26px ${f.color};" onclick="cpOpen('${i}',this)"></div><input class="ti" id="ct-f${i}" value="${f.color}" oninput="setFColor(${i},this.value)"></div></div>
      <div class="fld"><span class="lbl">对齐</span><div class="alnbtns">
        <button class="${f.align==='left'?'on':''}" onclick="setAlign(${i},'left')">左</button>
        <button class="${f.align==='center'?'on':''}" onclick="setAlign(${i},'center')">中</button>
        <button class="${f.align==='right'?'on':''}" onclick="setAlign(${i},'right')">右</button></div></div>
      <div class="fld"><span class="lbl">水平 X</span>${sn('f'+i+'x',-200,1200,1,f.x,'setF',i+",'x',")}</div>
      <div class="fld"><span class="lbl">垂直 Y</span>${sn('f'+i+'y',-100,1600,1,f.y,'setF',i+",'y',")}</div>
      <div class="fld"><span class="lbl">字间距</span>${sn('f'+i+'ls',0,1,0.01,f.ls,'setF',i+",'ls',")}</div>
      <div class="fld"><span class="lbl">行高</span>${sn('f'+i+'lh',0.8,2.2,0.01,f.lh,'setF',i+",'lh',")}</div>
      <div class="fld"><label class="lbl" style="cursor:pointer"><input type="checkbox" ${f.shadow?'checked':''} onchange="setF(${i},'shadow',this.checked?1:0)"> 文字阴影</label></div>
    </div></div>`;
  });
  // 网格整体
  const a=proj.arch;
  html+=`<div class="sec" data-k="arch"><div class="sec-h" onclick="this.parentNode.classList.toggle('open')"><span>图片布局（整体）</span><span class="ar">▶</span></div><div class="sec-b">
    <div class="fld"><span class="lbl">主图高度</span>${sn('archT',400,1300,1,a.heroH,'setArch',"'heroH',")}</div>
    <div class="fld"><span class="lbl">主图渐变起点（%，越小过渡越长）</span>${sn('archGS',0,95,1,a.gradStart,'setArch',"'gradStart',")}</div>
    <div class="fld"><span class="lbl">网格数量</span><div class="alnbtns">
      <button class="${(a.cols||3)===3?'on':''}" onclick="setCols(3)">3 图</button>
      <button class="${(a.cols||3)===4?'on':''}" onclick="setCols(4)">4 图</button></div></div>
    <div class="fld"><span class="lbl">网格顶部 Y</span>${sn('archAY',700,1550,1,a.gridY,'setArch',"'gridY',")}</div>
    <div class="fld"><span class="lbl">网格高度</span>${sn('archGH',150,800,1,a.gridH,'setArch',"'gridH',")}</div>
    <div class="fld"><span class="lbl">网格间距</span>${sn('archG',0,80,1,a.gap,'setArch',"'gap',")}</div>
    <div class="fld"><span class="lbl">左右边距</span>${sn('archM',0,160,1,a.margin,'setArch',"'margin',")}</div>
    <div class="fld"><span class="lbl">网格圆角</span>${sn('archR',0,60,1,a.radius,'setArch',"'radius',")}</div>
  </div></div>`;
  // 按钮标签（双色胶囊）
  const b=proj.btn;
  html+=`<div class="sec" data-k="btn"><div class="sec-h" onclick="this.parentNode.classList.toggle('open')"><span>按钮标签（胶囊）</span><span class="ar">▶</span></div><div class="sec-b">
    <div class="fld"><span class="lbl">左段文字（留空隐藏）</span><input class="ti" value="${(b.tL||'').replace(/"/g,'&quot;')}" oncompositionstart="_imeOn=true" oncompositionend="_imeOn=false;setBtn('tL',this.value)" oninput="if(!_imeOn)setBtn('tL',this.value)"></div>
    <div class="fld"><span class="lbl">右段标签（留空隐藏）</span><input class="ti" value="${(b.tR||'').replace(/"/g,'&quot;')}" oncompositionstart="_imeOn=true" oncompositionend="_imeOn=false;setBtn('tR',this.value)" oninput="if(!_imeOn)setBtn('tR',this.value)"></div>
    <div class="fld"><span class="lbl">字号</span>${sn('btnS',16,60,1,b.size,'setBtn',"'size',")}</div>
    <div class="fld"><span class="lbl">垂直 Y</span>${sn('btnY',600,1550,1,b.y,'setBtn',"'y',")}</div>
    <div class="fld"><span class="lbl">左段底色 / 字色</span><div class="row">
      <div class="cd" id="cd-btnCL" style="box-shadow:inset 0 0 0 26px ${b.cL};" onclick="cpOpen('@btnCL',this)"></div>
      <div class="cd" id="cd-btnTL" style="box-shadow:inset 0 0 0 26px ${b.tcL};" onclick="cpOpen('@btnTL',this)"></div>
      <span class="hint" style="margin:0;">左：底 / 字</span></div></div>
    <div class="fld"><span class="lbl">右段底色 / 字色</span><div class="row">
      <div class="cd" id="cd-btnCR" style="box-shadow:inset 0 0 0 26px ${b.cR};" onclick="cpOpen('@btnCR',this)"></div>
      <div class="cd" id="cd-btnTR" style="box-shadow:inset 0 0 0 26px ${b.tcR};" onclick="cpOpen('@btnTR',this)"></div>
      <span class="hint" style="margin:0;">右：底 / 字</span></div></div>
  </div></div>`;
  // 各槽位
  for(let i=0;i<5;i++){
    const s=a.slots[i], has=!!imgURLs['s'+i];
    if(i>(a.cols||3))continue; // 3图模式隐藏第4张
    const nm=i===0?'主图':'网格图 '+i;
    html+=`<div class="sec" data-k="s${i}"><div class="sec-h" onclick="this.parentNode.classList.toggle('open')"><span>${nm}</span><span class="ar">▶</span></div><div class="sec-b">
      <div class="up" onclick="pickImg('s${i}')">${has?'点击替换图片':'点击上传图片'}</div>
      ${has?`<div class="hint">画面上可直接拖动调位</div>
      <div class="fld" style="margin-top:9px;"><span class="lbl">缩放</span>${sn('s'+i+'zoom',0.5,3,0.01,s.zoom,'setSlot',i+",'zoom',")}</div>
      <div class="fld"><span class="lbl">水平位置</span>${sn('s'+i+'px',0,100,1,s.px,'setSlot',i+",'px',")}</div>
      <div class="fld"><span class="lbl">垂直位置</span>${sn('s'+i+'py',0,100,1,s.py,'setSlot',i+",'py',")}</div>`:''}
    </div></div>`;
  }

/* ---------- cp() 拾色器（规范 §11） ---------- */
const CP_PRESETS=['#ffffff','#000000','#1a1410','#c8a06a','rgba(212,180,120,0.9)','rgba(255,255,255,0.9)','rgba(255,255,255,0.5)','rgba(0,0,0,0.5)','#f5e6c8','#d4af7a','#8b6914','#c8392b','#2c4a8c','#2a6e3f'];
let _cpKey=null,_cpH=0,_cpS=0,_cpV=1,_cpA=1,_cpDrag=null;
function parseColor(h){h=(h||'').trim();if(h[0]==='#'){let x=h.slice(1);if(x.length===3)x=x[0]+x[0]+x[1]+x[1]+x[2]+x[2];return{r:parseInt(x.slice(0,2),16)||0,g:parseInt(x.slice(2,4),16)||0,b:parseInt(x.slice(4,6),16)||0,a:1};}const m=h.match(/[\d.]+/g);if(m&&m.length>=3)return{r:Math.round(+m[0]),g:Math.round(+m[1]),b:Math.round(+m[2]),a:m[3]!==undefined?+m[3]:1};return{r:255,g:255,b:255,a:1};}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}return{h,s:mx?d/mx:0,v:mx};}
function hsv2rgb(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}return{r:Math.round((r+m)*255),g:Math.round((g+m)*255),b:Math.round((b+m)*255)};}
function cpStr(){const{r,g,b}=hsv2rgb(_cpH,_cpS,_cpV);return _cpA>=1?'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''):`rgba(${r},${g},${b},${Math.round(_cpA*100)/100})`;}
function cpFromVal(v){const c=parseColor(v);const k=rgb2hsv(c.r,c.g,c.b);_cpH=k.h;_cpS=k.s;_cpV=k.v;_cpA=c.a;}
function curColor(){
  const M={'@bgTop':()=>proj.bgTop,'@bgBot':()=>proj.bgBot,'@btnCL':()=>proj.btn.cL,'@btnCR':()=>proj.btn.cR,'@btnTL':()=>proj.btn.tcL,'@btnTR':()=>proj.btn.tcR};
  if(M[_cpKey])return M[_cpKey]();

}

async function cpEyedrop(){

function cpClose(){$('cp-pop').style.display='none';_cpKey=null;}
function cpApply(){
  const s=cpStr();
  const M={
    '@bgTop':()=>{setBgTop(s);const t=$('ct-bgTop');if(t)t.value=s;},
    '@bgBot':()=>{setBgBot(s);const t=$('ct-bgBot');if(t)t.value=s;},
    '@btnCL':()=>{setBtn('cL',s);const c=$('cd-btnCL');if(c)c.style.boxShadow='inset 0 0 0 26px '+s;},
    '@btnCR':()=>{setBtn('cR',s);const c=$('cd-btnCR');if(c)c.style.boxShadow='inset 0 0 0 26px '+s;},
    '@btnTL':()=>{setBtn('tcL',s);const c=$('cd-btnTL');if(c)c.style.boxShadow='inset 0 0 0 26px '+s;},
    '@btnTR':()=>{setBtn('tcR',s);const c=$('cd-btnTR');if(c)c.style.boxShadow='inset 0 0 0 26px '+s;},
  };
  if(M[_cpKey]){M[_cpKey]();return;}
  const i=+_cpKey;setFColor(i,s);$('ct-f'+i).value=s;
}
function cpRender(){
  const{r,g,b}=hsv2rgb(_cpH,_cpS,_cpV), hr=hsv2rgb(_cpH,1,1);
  $('cp-sv').style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,transparent),rgb(${hr.r},${hr.g},${hr.b})`;
  $('cp-sv-cur').style.left=(_cpS*100)+'%';$('cp-sv-cur').style.top=((1-_cpV)*100)+'%';
  $('cp-hue-cur').style.left=(_cpH/360*100)+'%';
  $('cp-alpha').style.background=`linear-gradient(to right,transparent,rgb(${r},${g},${b})),repeating-conic-gradient(#888 0 25%,#fff 0 50%) 0 0/8px 8px`;
  $('cp-alpha-cur').style.left=(_cpA*100)+'%';
  $('cp-r').value=r;$('cp-g').value=g;$('cp-b').value=b;$('cp-a').value=Math.round(_cpA*100)/100;
}
function cpAt(el,e){const r=el.getBoundingClientRect();return Math.max(0,Math.min(1,((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width));}
function _cpSV(e){const sv=$('cp-sv'),r=sv.getBoundingClientRect();_cpS=Math.max(0,Math.min(1,((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width));_cpV=1-Math.max(0,Math.min(1,((e.touches?e.touches[0].clientY:e.clientY)-r.top)/r.height));cpRender();cpApply();}
function _cpHue(e){_cpH=cpAt($('cp-hue'),e)*360;cpRender();cpApply();}
function _cpAlpha(e){_cpA=cpAt($('cp-alpha'),e);cpRender();cpApply();}
function _cpNum(){const r=+$('cp-r').value||0,g=+$('cp-g').value||0,b=+$('cp-b').value||0;let a=parseFloat($('cp-a').value);if(isNaN(a))a=1;a=Math.max(0,Math.min(1,a));const k=rgb2hsv(r,g,b);_cpH=k.h;_cpS=k.s;_cpV=k.v;_cpA=a;cpRender();cpApply();}
function cpPreset(c){cpFromVal(c);cpRender();cpApply();}
document.addEventListener('mousedown',e=>{const pop=$('cp-pop');if(_cpKey&&pop.style.display==='block'&&!pop.contains(e.target)&&!(e.target.classList&&e.target.classList.contains('cd')))cpClose();});
document.addEventListener('mousemove',e=>{if(_cpDrag==='sv')_cpSV(e);else if(_cpDrag==='hue')_cpHue(e);else if(_cpDrag==='alpha')_cpAlpha(e);});

/* ---------- 导出（规范 §6/§10） ---------- */
function drawTextLS(ctx,text,cx,y,lsEm,align){
  const fs=parseFloat(ctx.font.match(/([\d.]+)px/)?.[1]||16);
  const ls=lsEm*fs, chars=[...text];
  let total=0;chars.forEach((ch,i)=>{total+=ctx.measureText(ch).width;if(i<chars.length-1)total+=ls;});
  let sx=align==='center'?cx-total/2:align==='right'?cx-total:cx;
  chars.forEach((ch,i)=>{ctx.fillText(ch,sx,y);sx+=ctx.measureText(ch).width+(i<chars.length-1?ls:0);});
}
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
async function doExport(){
  if(!await wpCheckExportQuota())return;
  const btn=$('exportBtn');btn.textContent='导出中…';btn.disabled=true;
  try{
    await document.fonts.ready;
    const cv=document.createElement('canvas');cv.width=EXPORT_W;cv.height=EXPORT_H;
    const ctx=cv.getContext('2d');
    {const g=ctx.createLinearGradient(0,0,0,EXPORT_H);g.addColorStop(0,proj.bgTop);g.addColorStop(1,proj.bgBot);ctx.fillStyle=g;ctx.fillRect(0,0,EXPORT_W,EXPORT_H);}
    // 先画四张网格图（矩形裁切，与预览 overflow:hidden 一致）
    const rects=archRects();
    for(let i=0;i<rects.length;i++){
      const key='s'+i;
      if(!imgURLs[key]||!imgDims[key])continue;
      const r=rects[i], s=proj.arch.slots[i], d=imgDims[key];
      const L=iLay(d.w,d.h,r.w,r.h,s.zoom,s.px,s.py);
      const im=await loadImg(imgURLs[key]);
      ctx.save();
      if(i>0){rr(ctx,r.x,r.y,r.w,r.h,proj.arch.radius||0);}else{ctx.beginPath();ctx.rect(r.x,r.y,r.w,r.h);}
      ctx.clip();
      ctx.drawImage(im,r.x+L.left,r.y+L.top,L.width,L.height);
      ctx.restore();
    }
    // 主图底部无缝过渡（与预览同一采样）
    {const F=heroFadeStops();
     const g=ctx.createLinearGradient(0,F.gy,0,F.end);
     F.stops.forEach(s=>g.addColorStop(s.p,`rgba(${s.r},${s.g},${s.b},${s.a})`));
     ctx.fillStyle=g;ctx.fillRect(0,F.gy,EXPORT_W,F.end-F.gy);}
    // 双色胶囊按钮
    {const B=btnRect();
     if(B){const b=proj.btn;
      ctx.save();
      rr(ctx,B.x,B.y,B.total,B.h,B.r);ctx.clip();
      if(B.segL){ctx.fillStyle=b.cL;ctx.fillRect(B.x,B.y,B.segL,B.h);}
      if(B.segR){ctx.fillStyle=b.cR;ctx.fillRect(B.x+B.segL,B.y,B.segR,B.h);}
      ctx.restore();
      ctx.save();
      ctx.font=`600 ${b.size}px 'Noto Sans SC'`;ctx.textBaseline='top';
      const ty=B.y+(B.h-b.size)/2;
      if(B.segL){ctx.fillStyle=b.tcL;drawTextLS(ctx,b.tL,B.x+B.segL/2,ty,B.ls,'center');}
      if(B.segR){ctx.fillStyle=b.tcR;drawTextLS(ctx,b.tR,B.x+B.segL+B.segR/2,ty,B.ls,'center');}
      ctx.restore();}}
    // 后画文字（压在图上，与预览 z-index 层级一致）
    ctx.textBaseline='top';
    proj.fields.forEach(f=>{
      ctx.save();
      ctx.font=`${f.weight} ${f.size}px ${f.font}`;
      ctx.fillStyle=f.color;
      if(f.shadow){ctx.shadowColor='rgba(0,0,0,0.4)';ctx.shadowBlur=16;ctx.shadowOffsetY=4;}
      String(f.text).split('\n').forEach((ln,li)=>{
        drawTextLS(ctx,ln,f.x,f.y+li*f.size*f.lh,f.ls,f.align);
      });
      ctx.shadowBlur=0;ctx.shadowOffsetY=0;
      ctx.restore();
    });
    cv.toBlob(b=>{
      const url=URL.createObjectURL(b);const a=document.createElement('a');
      a.download=(proj.name||'poster')+'.png';a.href=url;a.click();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
    },'image/png');
  }catch(e){alert('导出失败：'+e.message);}
  finally{btn.textContent='导出';btn.disabled=false;}
}

function importJSON(inp){
  const file=inp.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    if(jsonImportBusy)return;
    jsonImportBusy=true;
    try{
      const d=JSON.parse(rd.result),next=d&&d.data;
      if(!next||typeof next!=='object'||Array.isArray(next)||!Array.isArray(next.fields)||next.fields.some(f=>!f||typeof f!=='object'||typeof f.key!=='string'||typeof f.text!=='string'))throw new Error('文件格式不对');
      if(next.name!=null&&typeof next.name!=='string')throw new Error('文件格式不对');
      next.name=next.name||'未命名项目';
      // Finish the previous project's pending save before replacing runtime state.
      clearTimeout(saveT);await savePending;
      const previous={proj,projId,undoStack,lastSnap:_lastSnap,imageGeneration:jsonImageGeneration,imgBlobs,imgURLs,imgDims};
      if(proj){
        const rec={name:proj.name,data:JSON.parse(JSON.stringify(proj)),imgs:imgBlobs,updated:Date.now()};
        if(projId!=null)rec.id=projId;
        const id=await dbPut(rec);if(id==null)throw new Error('当前项目保存失败，请重试');
        projId=previous.projId=id;
      }
      jsonImageGeneration++;proj=next;projId=null;undoStack=[];_lastSnap=0;
      imgBlobs=Object.fromEntries(Object.keys(previous.imgBlobs).map(k=>[k,null]));imgURLs={};imgDims={};
      try{
        $('projName').value=proj.name;buildPanel();render();
        const id=await dbPut({name:proj.name,data:JSON.parse(JSON.stringify(proj)),imgs:imgBlobs,updated:Date.now()});
        if(id==null)throw new Error('导入项目保存失败，请重试');
        projId=id;
      }catch(err){
        proj=previous.proj;projId=previous.projId;undoStack=previous.undoStack;_lastSnap=previous.lastSnap;jsonImageGeneration=previous.imageGeneration;
        imgBlobs=previous.imgBlobs;imgURLs=previous.imgURLs;imgDims=previous.imgDims;
        $('projName').value=proj.name;buildPanel();render();throw err;
      }
      Object.values(previous.imgURLs).forEach(url=>{if(url)URL.revokeObjectURL(url);});
      alert('导入成功（图片需重新上传）');
    }catch(e){alert('导入失败：'+e.message);}
    finally{jsonImportBusy=false;}
  };
  rd.readAsText(file);inp.value='';
}

function describe(){return {version:'1.0.0',templateId:P.id,size:{width:1200,height:1600},mode:'new-project',textAliases:clone(P.aliases),nativeTextKeys:P.fields.map(f=>f.key),images:clone(P.slots),crop:{zoom:'1–3',x:'0–100，0左/100右',y:'0–100，0上/100下'},status:'technical-adapter; visual-review-required'};}
function plan(task){
 if(!task||typeof task!=='object'||Array.isArray(task))throw error('INVALID_TASK','任务必须是对象');
 const allowed=['templateId','name','store','hall','texts','nativeTexts','images','font'];
 for(const k of Object.keys(task))if(!allowed.includes(k))throw error('UNKNOWN_FIELD','未知任务字段：'+k);
 if(Number(task.templateId)!==P.id)throw error('TEMPLATE_MISMATCH','模板编号不匹配');
 for(const k of ['name','store'])if(typeof task[k]!=='string'||!task[k].trim())throw error('MISSING_METADATA','缺少 '+k);
 if(task.font!=null&&(typeof task.font!=='string'||!task.font.trim()||/[;{}<>]/.test(task.font)))throw error('INVALID_FONT','字体名称无效');
 const state=clone(P.defaultState),texts={};
 for(const f of P.fields){const target=getField(state,f.key);target[contentKey]='';if(modern&&f.key.startsWith('brand.'))target.mode='text';if(task.font)target[modern?'f':'font']=task.font;}
 // Decorative sample copy is also removed, not just the headline.
 if(state.ribbon){state.ribbon.text='';state.ribbon.on=0;}
 if(state.btn){state.btn.tL='';state.btn.tR='';}
 for(const source of ['texts','nativeTexts']){
  const values=task[source]||{};if(typeof values!=='object'||Array.isArray(values))throw error('INVALID_TEXTS',source+' 必须是对象');
  for(const [key,value] of Object.entries(values)){
   const native=source==='texts'?P.aliases[key]:key;
   if(!native||!P.fields.some(f=>f.key===native))throw error('UNSUPPORTED_TEXT','模板 '+P.id+' 不支持文字字段 '+key);
   if(Object.hasOwn(texts,native))throw error('DUPLICATE_TEXT','文字字段重复赋值：'+native);
   if(typeof value!=='string')throw error('INVALID_TEXT','文字必须是字符串：'+key);
   if(modern&&/[\r\n]/.test(value))throw error('UNSUPPORTED_MULTILINE','本模板文字层不支持自动换行：'+key);
   texts[native]=value;getField(state,native)[contentKey]=value;
  }
 }
 const images=task.images;
 if(!Array.isArray(images))throw error('MISSING_IMAGES','images 必须是图片数组');
 const seen=new Set();
 for(const img of images){
  if(!img||typeof img!=='object')throw error('INVALID_IMAGE','图片条目无效');
  for(const k of Object.keys(img))if(!['slot','src','zoom','x','y','subject','hall','store','assetId'].includes(k))throw error('UNKNOWN_IMAGE_FIELD','未知图片字段：'+k);
  if(!P.slots.some(s=>s.key===img.slot))throw error('UNKNOWN_SLOT','无此图位：'+img.slot);
  if(seen.has(img.slot))throw error('DUPLICATE_SLOT','图位重复：'+img.slot);seen.add(img.slot);
  if(typeof img.src!=='string'||!/^data:image\/(png|jpeg|webp);base64,/.test(img.src))throw error('IMAGE_SOURCE','图片须由本地任务程序转为 PNG/JPEG/WebP data URL');
  if(img.store&&img.store!==task.store)throw error('STORE_MISMATCH','图片门店与任务不一致：'+img.slot);
  if(task.hall&&img.hall&&img.hall!==task.hall)throw error('HALL_MISMATCH','图片厅名与任务不一致：'+img.slot);
  for(const [k,min,max] of [['zoom',1,3],['x',0,100],['y',0,100]])if(img[k]!=null&&(!Number.isFinite(img[k])||img[k]<min||img[k]>max))throw error('INVALID_CROP','裁切参数超范围：'+img.slot+'.'+k);
 }
 for(const s of P.slots)if(!s.opt&&!seen.has(s.key))throw error('MISSING_IMAGE','缺少图片：'+s.key);
 if(!images.length)throw error('MISSING_IMAGES','至少提供一张图片');
 if(window.__jinheSeeding)window.jinhePatchCopy(state);return {state,images};
}
function checkTextBounds(state){
 const issues=[],boxes=[],ctx=document.createElement('canvas').getContext('2d');
 for(const f of P.fields){const t=getField(state,f.key),text=t[contentKey];if(!text)continue;
  const size=t.size,font=modern?t.f:t.font,weight=modern?(f.key.startsWith('brand.')?t.wt:t.w):t.weight;
  ctx.font=`${weight||400} ${size}px ${font}`;ctx.textBaseline=modern?'middle':'top';
  let x=modern?(t.cx??t.x):t.x,y=modern?(t.cy??t.y):t.y;
  if(t.anch){const a=t.anch,r=P.slots.find(r=>r.key===a.k);if(!r)continue;x=r.x+r.w*(a.ax??0.5)+(a.dx??0);y=r.y+r.h*(a.ay??0.5)+(a.dy??0);}
  let max=0,ascent=-Infinity,descent=-Infinity;for(const line of text.split('\n')){const m=ctx.measureText(line);max=Math.max(max,m.width+Math.max(0,[...line].length-1)*(t.ls||0)*size);ascent=Math.max(ascent,m.actualBoundingBoxAscent);descent=Math.max(descent,m.actualBoundingBoxDescent);}
  let left=x-(t.align==='center'?max/2:t.align==='right'?max:0),top=y-ascent,bottom=y+descent+(text.split('\n').length-1)*size*(t.lh||1.2),right=left+max;
  if(t.rotate){const rad=t.rotate*Math.PI/180,points=[[left,top],[right,top],[right,bottom],[left,bottom]].map(([px,py])=>[x+(px-x)*Math.cos(rad)-(py-y)*Math.sin(rad),y+(px-x)*Math.sin(rad)+(py-y)*Math.cos(rad)]);left=Math.min(...points.map(p=>p[0]));right=Math.max(...points.map(p=>p[0]));top=Math.min(...points.map(p=>p[1]));bottom=Math.max(...points.map(p=>p[1]));}
  if(left<0||right>1200||top<0||bottom>1600)issues.push({code:'TEXT_OUT_OF_CANVAS',field:f.key,message:'文字超出画布边界，请缩短文字或改用其他模板'});
  if(P.id===62&&t.region==='table'){const edge=state.lay.colX;if((t.cx<=600&&left+max>edge)||(t.cx>600&&left<edge))issues.push({code:'TEXT_OUT_OF_CELL',field:f.key,message:'文字越过信息表分栏，请缩短内容'});}
  if(P.aliases.decoration!==f.key)boxes.push({field:f.key,left,right,top,bottom});
 }
 for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++){const a=boxes[i],b=boxes[j];if(Math.min(a.right,b.right)-Math.max(a.left,b.left)>4&&Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)>4)issues.push({code:'TEXT_OVERLAP',field:a.field+' / '+b.field,message:'两个文字层发生重叠，请缩短内容或选择其他模板'});}
 return issues;
}
async function fonts(state){
 const requested=new Map();for(const f of P.fields){const t=getField(state,f.key);if(!t[contentKey])continue;const family=modern?t.f:t.font;const weight=modern?(t.wt||t.w||400):t.weight;requested.set(`${weight} ${t.size}px ${family}`,t[contentKey]);}
 if(P.id===62){await Promise.all(P.fields.map(async f=>{const t=getField(state,f.key);if(t.s&&!await ensureOneFont(t.f,t.wt||t.w||400,t.s))throw error('FONT_UNAVAILABLE','62号模板未能加载字体：'+t.f);}));}
 await Promise.all([...requested].map(([font,txt])=>document.fonts.load(font,txt)));for(const [font,txt] of requested){if(!document.fonts.check(font,txt))throw error('FONT_UNAVAILABLE','字体未就绪：'+font);}
 await document.fonts.ready;
}
async function decode(img){
 const blob=await (await fetch(img.src)).blob();if(blob.size>35*1024*1024)throw error('IMAGE_TOO_LARGE','单图超过35MB');
 const url=URL.createObjectURL(blob),el=new Image();
 try{await Promise.race([new Promise((ok,no)=>{el.onload=ok;el.onerror=()=>no(error('IMAGE_DECODE','图片无法解码：'+img.slot));el.src=url;}),wait(15000).then(()=>{throw error('IMAGE_TIMEOUT','图片解码超时');})]);return {...img,blob,url,el,nw:el.naturalWidth,nh:el.naturalHeight};}
 catch(e){URL.revokeObjectURL(url);throw e;}
}
async function apply(task){
 if(busy)throw error('BUSY','上一任务尚未完成');busy=true;let prepared=[];
 try{
  await ready();const p=plan(task);await fonts(p.state);
  const issues=checkTextBounds(p.state);if(issues.length)throw error(issues[0].code,issues[0].field+'：'+issues[0].message);
  // Decode every image before changing the active project.
  for(const i of p.images)prepared.push(await decode(i));
  await wait(650); // Let the existing manual autosave finish before allocating a new project.
  await newProject();
  if(modern){
   S=p.state;projName=task.name;projId='auto_'+crypto.randomUUID();const input=document.getElementById('projname');if(input)input.value=projName;
   for(const i of prepared){const id='auto_img_'+crypto.randomUUID();await idbPut('img',{id,blob:i.blob});await loadImg(i.slot,id);S.imgs[i.slot]={...S.imgs[i.slot],zoom:i.zoom??1,px:i.x??50,py:i.y??50};}
   render();buildPanel();saveProject();
  }else{
   proj=p.state;proj.name=task.name;projId=window.__jinheOriginalSeeding?window.jinheOriginalId:null;const input=document.getElementById('projName');if(input)input.value=proj.name;
   for(const i of prepared){
    if(i.slot==='background'){bgBlob=i.blob;loadBg();proj.imgZoom=i.zoom??1;proj.imgPX=i.x??50;proj.imgPY=i.y??50;}
    else{setImg(i.slot,i.blob);const n=Number(i.slot.slice(1));proj.arch.slots[n]={...proj.arch.slots[n],zoom:i.zoom??1,px:i.x??50,py:i.y??50};}
   }
   const until=Date.now()+15000;while(prepared.some(i=>i.slot==='background'?(!bgURL||!bgNW):!imgDims[i.slot])){if(Date.now()>until)throw error('IMAGE_TIMEOUT','图片未进入模板');await wait(25);}
   render();buildPanel();save();
  }
  await fonts(p.state);await wait(750);lastTask=clone({...task,images:task.images.map(({src,...i})=>i)});
  return {ok:true,templateId:P.id,projectId:projId,warnings:visualWarnings(prepared),reviewRequired:true};
 }finally{for(const i of prepared)URL.revokeObjectURL(i.url);busy=false;}
}
function visualWarnings(images){
 const warnings=[{code:'VISUAL_REVIEW',message:'需检查主体、人物完整度、近似视角和文案事实；技术检查不替代审美验收'}];
 const seen=new Map();for(const i of images){if(seen.has(i.src))warnings.push({code:'DUPLICATE_SOURCE',slot:i.slot,other:seen.get(i.src)});seen.set(i.src,i.slot);
  const r=P.slots.find(x=>x.key===i.slot);if(Math.min(r.w,r.h)<350)warnings.push({code:'SMALL_SLOT',slot:i.slot,message:'小图位需人工确认仍可看清主体'});
  const ratio=(i.nw/i.nh)/(r.w/r.h);if(Math.min(ratio,1/ratio)<.55)warnings.push({code:'HEAVY_CROP',slot:i.slot,message:'裁切较多，请检查舞台、人物及地面是否保留'});
 }return warnings;
}
async function validate(){await ready();const issues=checkTextBounds(modern?S:proj);for(const r of P.slots){const present=modern?imgSrc[r.key]:r.key==='background'?bgURL:imgURLs[r.key];if(!r.opt&&!present)issues.push({code:'MISSING_IMAGE',slot:r.key});}return {ok:issues.length===0,issues,reviewRequired:true,lastTask};}
async function preflight(task){await ready();const p=plan(task);await fonts(p.state);const issues=checkTextBounds(p.state);return {ok:!issues.length,issues,imagesDecoded:false,note:'只检查任务结构、字体和文字边界；apply 时再检查图片解码'};}
async function exportPNG(){if(busy)throw error('BUSY','正在导入');const report=await validate();if(!report.ok)throw error('VALIDATION_FAILED',JSON.stringify(report.issues));busy=true;try{await doExport();return {requested:true,note:'实际完成以浏览器下载事件为准；仍执行模板原有导出校验'};}finally{busy=false;}}
window.posterAutomation=Object.freeze({version:'1.0.0',ready,describe,preflight,apply,validate,exportPNG});
})();
