/* ===== 三、规范 §十：iLay / drawTextLS（预览与导出共用） ===== */
function iLay(nW,nH,cW,cH,zoom,px,py){
  if(!nW||!nH) return {left:0,top:0,width:cW,height:cH};
  const s=Math.max(cW/nW,cH/nH)*(zoom||1);
  const rW=nW*s, rH=nH*s;
  /* 与规范 §十 同式（rW>cW 时等价于 -(px/100)*(rW-cW)），并推广到 zoom<1：50=居中不贴边 */
  return { left:Math.round((cW-rW)*(px==null?50:px)/100), top:Math.round((cH-rH)*(py==null?50:py)/100),
           width:Math.round(rW), height:Math.round(rH) };
}
/* 品牌图 contain 布局：完整显示、不拉伸不裁切，盒中心 (x,y)，全部取整 */
function bLay(nW,nH,x,y,bw,bh){
  if(!nW||!nH) return null;
  const s=Math.min(bw/nW,bh/nH);
  const w=Math.round(nW*s), h=Math.round(nH*s);
  return { left:Math.round(x-w/2), top:Math.round(y-h/2), width:w, height:h };
}
function drawTextLS(ctx,text,cx,y,letterSpacingEm,align,fn){
  const fs=parseFloat(ctx.font.match(/([\d.]+)px/)?.[1]||16);
  const ls=letterSpacingEm*fs;
  const chars=Array.from(String(text));   /* Array.from 保住 emoji/生僻字的代理对 */
  const put=fn||((c,x,yy)=>ctx.fillText(c,x,yy));
  let totalW=0;
  chars.forEach((ch,i)=>{ totalW+=ctx.measureText(ch).width; if(i<chars.length-1) totalW+=ls; });
  let sx = align==='center' ? cx-totalW/2 : align==='right' ? cx-totalW : cx;
  chars.forEach((ch,i)=>{ put(ch,sx,y); sx+=ctx.measureText(ch).width+(i<chars.length-1?ls:0); });
}

/* ── 画布底图：内置程序纹理 or 上传图片 ────────────────────────────
   纹理只生成一次并缓存同一个 canvas，预览用它的 dataURL、导出直接 drawImage，
   所以两边像素完全一致（不会因为二次生成的随机数不同而对不上）。 */
const TEXTURES=[['none','无（纯色）'],['cloud','云雾大理石'],['paper','纸纹'],
                ['grain','细颗粒'],['bokeh','柔焦光斑'],['grid','细网格'],['upload','上传图片']];
const _texCache={};
function rnd(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function makeTexture(kind,col){
  const key=kind+'|'+col;
  if(_texCache[key]) return _texCache[key];
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d'), R=rnd(20260801);
  x.fillStyle=col; x.fillRect(0,0,W,H);
  const rgb=parseColor(col);
  const tint=(dl,a)=>'rgba('+Math.max(0,Math.min(255,Math.round(rgb.r+dl)))+','
    +Math.max(0,Math.min(255,Math.round(rgb.g+dl)))+','
    +Math.max(0,Math.min(255,Math.round(rgb.b+dl)))+','+a+')';
  if(kind==='cloud'){
    for(let i=0;i<26;i++){
      const cx=R()*W, cy=R()*H, rr=180+R()*520, dl=(R()<0.5?-1:1)*(16+R()*30);
      const g=x.createRadialGradient(cx,cy,0,cx,cy,rr);
      g.addColorStop(0,tint(dl,0.46)); g.addColorStop(1,tint(dl,0));
      x.fillStyle=g; x.fillRect(cx-rr,cy-rr,rr*2,rr*2);
    }
  }else if(kind==='paper'){
    /* 纸纹 = 细噪底 + 纤维。只画纤维太稀疏，肉眼看不出，故先铺一层弱噪。*/
    const im0=x.getImageData(0,0,W,H), d0=im0.data;
    for(let i=0;i<d0.length;i+=4){ const n=(R()-0.5)*26; d0[i]+=n; d0[i+1]+=n; d0[i+2]+=n; }
    x.putImageData(im0,0,0);
    for(let i=0;i<24000;i++){
      const px=R()*W, py=R()*H, len=8+R()*30, dl=(R()<0.5?-1:1)*24;
      x.strokeStyle=tint(dl,0.20); x.lineWidth=1;
      x.beginPath(); x.moveTo(px,py); x.lineTo(px+len*(R()<0.5?1:-1),py+(R()-0.5)*3); x.stroke();
    }
  }else if(kind==='grain'){
    const im=x.getImageData(0,0,W,H), d=im.data;
    for(let i=0;i<d.length;i+=4){ const n=(R()-0.5)*52; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
    x.putImageData(im,0,0);
  }else if(kind==='bokeh'){
    for(let i=0;i<120;i++){
      const cx=R()*W, cy=R()*H, rr=30+R()*130;
      const g=x.createRadialGradient(cx,cy,0,cx,cy,rr);
      g.addColorStop(0,tint(34,0.55)); g.addColorStop(0.72,tint(26,0.20)); g.addColorStop(1,tint(26,0));
      x.fillStyle=g; x.beginPath(); x.arc(cx,cy,rr,0,Math.PI*2); x.fill();
    }
  }else if(kind==='grid'){
    x.strokeStyle=tint(-26,0.30); x.lineWidth=1;
    for(let gx=0;gx<=W;gx+=40){ x.beginPath(); x.moveTo(gx+.5,0); x.lineTo(gx+.5,H); x.stroke(); }
    for(let gy=0;gy<=H;gy+=40){ x.beginPath(); x.moveTo(0,gy+.5); x.lineTo(W,gy+.5); x.stroke(); }
  }
  _texCache[key]=c; return c;
}

function decorHTML(d){

  const rot=d.rot?'transform:rotate('+d.rot+'deg);':'';
  const base='position:absolute;left:'+d.x+'px;top:'+d.y+'px;width:'+d.w+'px;height:'+d.h+'px;pointer-events:none;'+rot+(d.r?'border-radius:'+d.r+'px;':'');
  if(d.type==='grad') return '<div style="'+base+'background:'+gradCSS(d)+';"></div>';
  if(d.type==='stroke') return '<div style="'+base+'border:'+(d.lw||2)+'px solid '+d.color+';"></div>';

function txtCSS(t){
  const P=txtPos(t);
  const shadow = t.sh>0 ? 'text-shadow:1px 2px '+(t.sh*2)+'px rgba(0,0,0,'+Math.min(.8,t.sh/12)+');' : '';
  const strk = t.st>0 ? '-webkit-text-stroke:'+t.st+'px '+t.stc+';paint-order:stroke fill;' : '';
  const tf = (t.align==='center' ? 'translateX(-50%)' : t.align==='right' ? 'translateX(-100%)' : 'translateX(0)')
           + (t.it ? ' skewX(-'+t.it+'deg)' : '');
  const org = t.align==='center' ? '50% 50%' : t.align==='right' ? '100% 50%' : '0 50%';
  return 'position:absolute;left:'+P.cx+'px;top:'+(P.cy-t.size/2)+'px;height:'+t.size+'px;line-height:'+t.size+'px;'
    +'transform:'+tf+';transform-origin:'+org+';white-space:nowrap;font-family:\''+t.f+'\',serif;font-size:'+t.size
    +'px;font-weight:'+t.w+';color:'+t.col+';'+shadow+strk;

function txtHTML(t){

  const span='<span style="letter-spacing:'+t.ls+'em;margin-right:-'+t.ls+'em;display:inline-block;">'+esc(t.s)+'</span>';
  let out='';
  /* 双层描边：底层用外描边 st2 再画一份（sticker 效果，47 用） */
  if(t.st2>0) out+='<div style="'+txtCSS(Object.assign({},t,{st:t.st2,stc:t.stc2||'#000'}))+'">'+span+'</div>';
  out+='<div style="'+txtCSS(t)+'">'+span+'</div>';
  return out;
}
/* ── 品牌三态组件：文字 / 图片(contain) / 无 ───────────────────────── */
function brandHTML(k){
  const b=S.brand[k]; if(!b||b.mode==='none') return '';
  const op=(b.op==null?1:b.op);
  if(b.mode==='text'){
    if(!b.s) return '';
    const t={s:b.s,f:b.f,size:b.size,w:b.wt,col:b.col,ls:b.ls,align:b.align,cx:b.x,cy:b.y,sh:b.sh||0,st:0,stc:'#000',it:0};
    return '<div style="opacity:'+op+';position:absolute;left:0;top:0;width:0;height:0;overflow:visible;">'+txtHTML(t)+'</div>';
  }
  const src=brandImg[k];
  if(!src){   /* 图片模式未上传：仅预览给虚线提示，导出绝不出现占位框 */
    return '<div style="position:absolute;left:'+Math.round(b.x-b.w/2)+'px;top:'+Math.round(b.y-b.h/2)+'px;width:'+b.w+'px;height:'+b.h+'px;'
      +'border:2px dashed rgba(160,150,130,0.8);display:flex;align-items:center;justify-content:center;color:rgba(150,140,120,0.9);font-size:20px;pointer-events:none;">'
      +BRAND_LABEL[k]+'：上传品牌图</div>';
  }

  return '<img src="'+src.url+'" style="position:absolute;left:'+g.left+'px;top:'+g.top+'px;width:'+g.width+'px;height:'+g.height+'px;opacity:'+op+';pointer-events:none;user-select:none;">';
}
function fit(){
  const st=$('stage'), pad=48;
  /* 窗口极小/面板未布局时 clientWidth 可能为 0，会算出负缩放导致画面翻转 —— 兜底下限 */
  sc=Math.max(0.05,Math.min((st.clientWidth-pad)/W,(st.clientHeight-pad)/H));
  $('poster').style.transform='scale('+sc+')';
  $('wrap').style.width=(W*sc)+'px'; $('wrap').style.height=(H*sc)+'px';
}
window.addEventListener('resize',fit);
function bindDrag(){
  KEYS.forEach(k=>{
    const el=$('slot_'+k); if(!el) return;
    el.addEventListener('pointerdown',e=>{
      if(!imgSrc[k]) return;
      const R=slotRects()[k], src=imgSrc[k], st=S.imgs[k];
      const g=iLay(src.nw,src.nh,R.w,R.h,st.zoom,st.px,st.py);
      const ovX=Math.max(0,g.width-R.w), ovY=Math.max(0,g.height-R.h);
      const x0=e.clientX, y0=e.clientY, px0=st.px, py0=st.py;
      try{el.setPointerCapture(e.pointerId);}catch(err){}
      snapshot();
      const mv=ev=>{
        const dx=(ev.clientX-x0)/sc, dy=(ev.clientY-y0)/sc;
        st.px = ovX>0 ? clamp(px0-dx/ovX*100,0,100) : 50;
        st.py = ovY>0 ? clamp(py0-dy/ovY*100,0,100) : 50;
        render(); if(curTab==='img') buildPanel();
      };
      const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);};
      el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
    });
    el.addEventListener('wheel',e=>{
      if(!imgSrc[k]) return; e.preventDefault(); snapshot();
      S.imgs[k].zoom=clamp(+(S.imgs[k].zoom+(e.deltaY<0?0.04:-0.04)).toFixed(2),0.5,3);
      render(); if(curTab==='img') buildPanel();
    },{passive:false});
  });
}

/* ===== 五、撤销栈（20 步，600ms 合并） ===== */
let undoStack=[], _lastSnap=0;
function snapshot(){
  const now=Date.now();
  if(undoStack.length && now-_lastSnap<600){ _lastSnap=now; return; }
  undoStack.push(JSON.stringify(S));
  if(undoStack.length>20) undoStack.shift();
  _lastSnap=now;
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='z'){
    const tag=(document.activeElement||{}).tagName;
    if(tag==='INPUT'||tag==='TEXTAREA') return;
    e.preventDefault();
    const s=undoStack.pop(); if(!s) return;
    S=JSON.parse(s); render(); buildPanel(); saveProject();
  }
});

/* ===== 六、面板组件 sn / ti / sel / cp ===== */
let _uid=0;
function sn(label,val,min,max,step,onchange){
  const id='sn'+(++_uid);
  const dec = step<1 ? String(step).split('.')[1].length : 0;
  setTimeout(()=>{
    const r=$(id+'_r'), n=$(id+'_n'); if(!r||!n) return;
    const push=(v,fromRange)=>{
      v=clamp(parseFloat(v),min,max); if(isNaN(v)) return;
      v=+v.toFixed(dec);
      r.value=v; if(!fromRange||document.activeElement!==n) n.value=v;
      snapshot(); onchange(v);
    };
    r.addEventListener('input',()=>push(r.value,true));
    n.addEventListener('input',()=>push(n.value,false));
  },0);
  return '<div class="fld"><label class="lbl">'+label+'</label><div class="sn">'
    +'<input type="range" id="'+id+'_r" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'">'
    +'<input type="number" class="num" id="'+id+'_n" value="'+val+'"></div></div>';
}
function ti(label,val,onchange){
  const id='ti'+(++_uid);
  setTimeout(()=>{
    const el=$(id); if(!el) return;
    let composing=false;
    el.addEventListener('compositionstart',()=>composing=true);
    el.addEventListener('compositionend',()=>{composing=false; snapshot(); onchange(el.value);});
    el.addEventListener('input',()=>{ if(composing) return; snapshot(); onchange(el.value); });
  },0);
  return '<div class="fld"><label class="lbl">'+label+'</label><input class="ti" id="'+id+'" value="'+esc(val)+'"></div>';
}
function sel(label,val,opts,onchange){
  const id='se'+(++_uid);
  setTimeout(()=>{const el=$(id); if(el) el.addEventListener('change',()=>{snapshot();onchange(el.value);});},0);
  let o='';
  opts.forEach(([v,t])=>{o+='<option value="'+esc(v)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(t)+'</option>';});
  return '<div class="fld"><label class="lbl">'+label+'</label><select class="ti" id="'+id+'">'+o+'</select></div>';
}
/* val 可传"取值函数"——颜色改完只 render 不重建面板时，闭包里的旧值会让拾色器
   再打开时跳回默认色。传函数就每次点开都读当前值。 */
function cp(label,val,onchange){
  const id='cp'+(++_uid);
  const get=(typeof val==='function')?val:()=>val;
  setTimeout(()=>{const el=$(id); if(el) el.addEventListener('click',()=>cpOpen(el,get(),v=>{snapshot();onchange(v);}));},0);
  return '<div class="fld"><label class="lbl">'+label+'</label><div class="cpsw" id="'+id+'"><i style="background:'+get()+'"></i></div></div>';
}
let _cpCb=null,_cpEl=null,_cpHSV={h:0,s:0,v:1},_cpA=1,_cpDrag=false;
function parseColor(c){
  c=String(c||'#000').trim();
  let m=c.match(/^rgba?\(([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:[,\s/]+([\d.]+))?\)$/i);
  if(m) return {r:+m[1],g:+m[2],b:+m[3],a:m[4]==null?1:+m[4]};
  m=c.match(/^#([0-9a-f]{3,8})$/i);
  if(m){ let h=m[1];
    if(h.length===3) h=h.split('').map(x=>x+x).join('');
    if(h.length===6) return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16),a:1};
    if(h.length===8) return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16),a:parseInt(h.slice(6,8),16)/255};
  }
  return {r:0,g:0,b:0,a:1};
}
function toCss(r,g,b,a){
  r=Math.round(r);g=Math.round(g);b=Math.round(b);
  if(a>=0.999) return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return 'rgba('+r+','+g+','+b+','+(+a.toFixed(3))+')';
}
function rgb2hsv(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0; if(d){ h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4); h*=60; }
  return {h,s:mx?d/mx:0,v:mx};
}
function hsv2rgb(h,s,v){
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return {r:(r+m)*255,g:(g+m)*255,b:(b+m)*255};
}
function cpOpen(el,val,cb){
  _cpCb=cb;_cpEl=el;
  const c=parseColor(val); _cpA=c.a; _cpHSV=rgb2hsv(c.r,c.g,c.b);
  const pop=$('cppop'), r=el.getBoundingClientRect();
  pop.classList.add('open');
  pop.style.left=Math.max(8,Math.min(window.innerWidth-256,r.left-260))+'px';
  pop.style.top=Math.max(8,Math.min(window.innerHeight-330,r.top-10))+'px';
  cpSync();
}
function cpClose(){ $('cppop').classList.remove('open'); _cpCb=null; }
function cpSync(push){
  const {r,g,b}=hsv2rgb(_cpHSV.h,_cpHSV.s,_cpHSV.v), css=toCss(r,g,b,_cpA);
  $('cpsat').style.background='hsl('+_cpHSV.h+',100%,50%)';
  $('cpdot').style.left=(_cpHSV.s*100)+'%'; $('cpdot').style.top=((1-_cpHSV.v)*100)+'%';
  $('cphue').value=_cpHSV.h; $('cpalpha').value=_cpA;
  $('cpR').value=Math.round(r); $('cpG').value=Math.round(g); $('cpB').value=Math.round(b); $('cpA').value=+_cpA.toFixed(2);
  if(document.activeElement!==$('cpTxt')) $('cpTxt').value=css;
  if(_cpEl) _cpEl.firstElementChild.style.background=css;
  if(push!==false && _cpCb) _cpCb(css);
}
(function initCP(){
  const sat=$('cpsat');
  const pick=e=>{
    const r=sat.getBoundingClientRect();
    _cpHSV.s=clamp((e.clientX-r.left)/r.width,0,1);
    _cpHSV.v=clamp(1-(e.clientY-r.top)/r.height,0,1);
    cpSync();
  };
  sat.addEventListener('pointerdown',e=>{_cpDrag=true;try{sat.setPointerCapture(e.pointerId);}catch(err){}pick(e);});
  sat.addEventListener('pointermove',e=>{if(_cpDrag)pick(e);});
  sat.addEventListener('pointerup',()=>_cpDrag=false);
  $('cphue').addEventListener('input',e=>{_cpHSV.h=+e.target.value;cpSync();});
  $('cpalpha').addEventListener('input',e=>{_cpA=+e.target.value;cpSync();});
  ['cpR','cpG','cpB','cpA'].forEach(id=>$(id).addEventListener('change',()=>{
    const r=clamp(+$('cpR').value||0,0,255), g=clamp(+$('cpG').value||0,0,255), b=clamp(+$('cpB').value||0,0,255);
    _cpA=clamp(+$('cpA').value,0,1); if(isNaN(_cpA))_cpA=1;
    _cpHSV=rgb2hsv(r,g,b); cpSync();
  }));
  $('cpTxt').addEventListener('change',()=>{ const c=parseColor($('cpTxt').value); _cpA=c.a; _cpHSV=rgb2hsv(c.r,c.g,c.b); cpSync(); });
  let pre=''; PRESETS.forEach(p=>{pre+='<b data-c="'+p+'" style="background:'+p+'"></b>';});
  $('cpPre').innerHTML=pre;
  $('cpPre').addEventListener('click',e=>{
    const c=e.target.dataset.c; if(!c) return;
    const q=parseColor(c); _cpA=q.a; _cpHSV=rgb2hsv(q.r,q.g,q.b); cpSync();
  });
  $('cpEye').addEventListener('click',async()=>{
    if(!window.EyeDropper){ toast('当前浏览器不支持吸管（需 Chrome/Edge 95+）'); return; }
    try{ $('cppop').style.visibility='hidden';
      const res=await new EyeDropper().open();
      const q=parseColor(res.sRGBHex); _cpA=1; _cpHSV=rgb2hsv(q.r,q.g,q.b); cpSync();
    }catch(e){} finally{ $('cppop').style.visibility='visible'; }
  });
  document.addEventListener('pointerdown',e=>{
    const pop=$('cppop'); if(!pop.classList.contains('open')) return;
    if(pop.contains(e.target)||(_cpEl&&_cpEl.contains(e.target))) return;
    cpClose();
  });
})();

/* ===== 七、右侧面板 ===== */
function setTab(t){ curTab=t; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t)); buildPanel(); }
/* 折叠状态存 openSec，面板重建（拖图/上传/改字体都会重建）时不再被重置 */
function secOpen(id){ const e=$(id); if(!e) return; e.classList.toggle('open'); openSec[id]=e.classList.contains('open'); }
function wrapSec(id,title,body,open){
  const on = (openSec[id]!==undefined) ? openSec[id] : !!open;
  return '<div class="sec'+(on?' open':'')+'" id="'+id+'"><div class="sec-h" onclick="secOpen(\''+id+'\')"><span>'+title+'</span><span class="ar">▶</span></div><div class="sec-b">'+body+'</div></div>';

function buildPanel(){
  const b=$('pbody'); let h='';
  if(curTab==='img'){
    liveKeys().forEach(k=>{
      let s='<div class="imgbtns"><button onclick="pickImg(\''+k+'\')">'+(imgSrc[k]?'替换图片':'上传图片')+'</button>'
        +'<button onclick="resetImg(\''+k+'\')">复位</button></div>';
      if(!imgSrc[k]) s+='<div class="hint">也可以直接点画面上这块的「＋ 插入图片」。</div>';
      s+=sn('缩放（1为铺满）',S.imgs[k].zoom,1,3,0.01,v=>{S.imgs[k].zoom=v;render();saveProject();});
      s+=sn('水平位置 %',S.imgs[k].px,0,100,1,v=>{S.imgs[k].px=v;render();saveProject();});
      s+=sn('垂直位置 %',S.imgs[k].py,0,100,1,v=>{S.imgs[k].py=v;render();saveProject();});
      s+='<div class="hint">也可直接在画面上拖动图片，滚轮缩放。cover 裁切，不留白边不变形。</div>';
      h+=wrapSec('sec_i'+k,IMG_LABEL[k],s,false);      /* 默认全收起 */
    });
  }
  if(curTab==='txt'){
    /* 样式字段（组内共享）与个体字段（各自的文案/位置）分开 */
    const styleCtl=(t,apply)=>{
      let s=sel('字体',t.f,FONTS,v=>{apply(o=>{o.f=v;o.w=fixWeight(v,o.w);});buildPanel();});
      const WL=weightsOf(t.f);
      s+='<div class="row2">'+sel('字重'+(WL.length===1?'（仅一档）':''),t.w,WL.map(w=>[w,String(w)]),v=>apply(o=>o.w=+v))
        +sel('对齐',t.align,[['left','左'],['center','居中'],['right','右']],v=>apply(o=>o.align=v))+'</div>';
      s+=sn('字号 px',t.size,10,240,1,v=>apply(o=>o.size=v));
      s+=sn('字间距 em',t.ls,0,1.2,0.01,v=>apply(o=>o.ls=v));
      s+=cp('颜色',()=>t.col,v=>apply(o=>o.col=v));
      s+=sn('倾斜角度',t.it||0,0,25,1,v=>apply(o=>o.it=v));
      s+=sn('阴影强度',t.sh,0,12,1,v=>apply(o=>o.sh=v));
      s+=sn('① 描边粗细（贴字）',t.st,0,12,0.5,v=>{apply(o=>o.st=v);});
      if(t.st>0) s+=cp('① 描边颜色',()=>t.stc,v=>apply(o=>o.stc=v));
      s+=sn('② 外描边粗细（更粗一圈）',t.st2||0,0,16,0.5,v=>{apply(o=>o.st2=v);});
      if(t.st2>0) s+=cp('② 外描边颜色',()=>t.stc2||'#000000',v=>apply(o=>o.stc2=v));
      if(t.st>0||t.st2>0)
        s+='<div class="hint">要完全去掉描边，①②都要归零（这张模板用的是哪一层，看哪个不为 0）。</div>';
      return s;
    };
    /* 锚定到图位的文字：调的是相对该图的偏移，图片数量一变自动跟随 */
    const posCtl=t=>{
      if(t.anch){

        s+=sn('垂直偏移 px',t.anch.dy||0,-600,600,1,v=>{t.anch.dy=v;render();saveProject();});

    Object.keys(S.txt).forEach(k=>{

      const t=S.txt[k];
      const apply=fn=>{ fn(t); render(); saveProject(); };
      let s=ti('文字内容',t.s,v=>{t.s=v;render();saveProject();});
      s+=styleCtl(t,apply);

  }
  if(curTab==='brand'){
    BKEYS.forEach((k,i)=>{
      const bb=S.brand[k]; let s='';
      s+=sel('模式',bb.mode,[['text','文字'],['image','图片'],['none','无（隐藏）']],v=>{bb.mode=v;render();buildPanel();saveProject();});

        s+=sel('字体',bb.f,FONTS,v=>{bb.f=v;bb.wt=fixWeight(v,bb.wt);render();buildPanel();saveProject();});
        const WL=weightsOf(bb.f);
        s+='<div class="row2">'+sel('字重'+(WL.length===1?'（仅一档）':''),bb.wt,WL.map(w=>[w,String(w)]),v=>{bb.wt=+v;render();saveProject();})
          +sel('对齐',bb.align,[['left','左'],['center','居中'],['right','右']],v=>{bb.align=v;render();saveProject();})+'</div>';
        s+=sn('字号 px',bb.size,10,240,1,v=>{bb.size=v;render();saveProject();});
        s+=sn('字间距 em',bb.ls,0,1.2,0.01,v=>{bb.ls=v;render();saveProject();});
        s+=cp('颜色',()=>bb.col,v=>{bb.col=v;render();saveProject();});
      }
      if(bb.mode==='image'){
        s+='<div class="imgbtns"><button onclick="pickBrand(\''+k+'\')">'+(brandImg[k]?'替换品牌图':'上传品牌图')+'</button>'
          +'<button onclick="removeBrandImg(\''+k+'\')">移除图片</button></div>';
        s+=sn('显示宽度 px',bb.w,20,1200,1,v=>{bb.w=v;render();saveProject();});
        s+=sn('显示高度 px',bb.h,20,800,1,v=>{bb.h=v;render();saveProject();});
        s+='<div class="hint">PNG/JPG/WebP，按 contain 完整显示，不拉伸不裁切。未上传时导出不会出现占位框。</div>';
      }
      s+=sn('水平 X px',bb.x,0,W,1,v=>{bb.x=v;render();saveProject();});
      s+=sn('垂直 Y px',bb.y,0,H,1,v=>{bb.y=v;render();saveProject();});
      s+=sn('不透明度',(bb.op==null?1:bb.op),0,1,0.01,v=>{bb.op=v;render();saveProject();});
      h+=wrapSec('sec_b'+k,BRAND_LABEL[k]+'（'+(bb.mode==='text'?'文字':bb.mode==='image'?'图片':'隐藏')+'）',s,i===0);
    });
  }
  if(curTab==='lay'){
    let s='';
    LAYCTL.forEach(c=>{
      if(c.type==='color') s+=cp(c.label,()=>S.lay[c.key],v=>{S.lay[c.key]=v;render();saveProject();});
      else s+=sn(c.label,S.lay[c.key],c.min,c.max,c.step||1,v=>{S.lay[c.key]=v;render();saveProject();});
    });
    h+=wrapSec('sec_lay','版式',s,true);
    /* 画布底：纯色 + 可选纹理/上传图（参考图里很多底不是纯色而是纹理） */
    const b=S.bgimg;
    let g=cp('画布底色',()=>S.bg,v=>{S.bg=v;render();saveProject();});
    g+=sel('底纹/底图',b.mode,TEXTURES,v=>{b.mode=v;render();buildPanel();saveProject();});
    if(b.mode==='upload'){
      g+='<div class="imgbtns"><button onclick="pickBg()">'+(bgImgSrc?'替换底图':'上传底图')+'</button>'
        +'<button onclick="removeBg()">移除底图</button></div>';
      g+=sn('缩放',b.zoom||1,0.5,3,0.01,v=>{b.zoom=v;render();saveProject();});
      g+=sn('水平位置 %',b.px==null?50:b.px,0,100,1,v=>{b.px=v;render();saveProject();});
      g+=sn('垂直位置 %',b.py==null?50:b.py,0,100,1,v=>{b.py=v;render();saveProject();});
    }
    if(b.mode&&b.mode!=='none') g+=sn('底图不透明度',b.op==null?1:b.op,0,1,0.01,v=>{b.op=v;render();saveProject();});
    if(b.mode&&b.mode!=='none'&&b.mode!=='upload')
      g+='<div class="hint">内置纹理按画布底色自动配色，改底色纹理跟着变；预览与导出用同一张纹理，不会有差异。</div>';
    h+=wrapSec('sec_bg','画布底',g,true);
  }
  b.innerHTML=h;
  setTimeout(listProjects,0);
}

/* ===== 八、图片：IndexedDB 存原始 blob（不压缩、不上传） ===== */
let _db=null;
function db(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const q=indexedDB.open(DB_NAME,2);
    q.onupgradeneeded=()=>{
      const d=q.result;
      if(!d.objectStoreNames.contains('proj')) d.createObjectStore('proj',{keyPath:'id'});
      if(!d.objectStoreNames.contains('img'))  d.createObjectStore('img',{keyPath:'id'});
      if(!d.objectStoreNames.contains('font')) d.createObjectStore('font',{keyPath:'id'});
    };
    q.onsuccess=()=>{_db=q.result;res(_db);};
    q.onerror=()=>rej(q.error);
  });
}
function idbPut(store,val){ return db().then(d=>new Promise((res,rej)=>{const t=d.transaction(store,'readwrite');t.objectStore(store).put(val);t.oncomplete=res;t.onerror=()=>rej(t.error);})); }
function idbGet(store,key){ return db().then(d=>new Promise((res,rej)=>{const r=d.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);})); }
function idbAll(store){ return db().then(d=>new Promise((res,rej)=>{const r=d.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);})); }
function idbDel(store,key){ return db().then(d=>new Promise((res,rej)=>{const t=d.transaction(store,'readwrite');t.objectStore(store).delete(key);t.oncomplete=res;t.onerror=()=>rej(t.error);})); }

async function registerFont(rec){
  try{
    const buf=await rec.blob.arrayBuffer();
    const ff=new FontFace(rec.name,buf);
    await ff.load(); document.fonts.add(ff);
    if(!CUSTOM_FONTS.some(f=>f.name===rec.name)) CUSTOM_FONTS.push({id:rec.id,name:rec.name});
    return true;
  }catch(e){ return false; }
}

  const all=await idbAll('font');

}

function importJSON(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();

      try{
        const j=JSON.parse(r.result);
        if(!j||!j.S||typeof j.S!=='object'||Array.isArray(j.S)||j.tpl!==DB_NAME)throw new Error('FORMAT');
        if(j.name!=null&&typeof j.name!=='string')throw new Error('FORMAT');
        const next=mergeState(j.S),nextName=j.name||'未命名项目';
        clearTimeout(_saveT);
        const previous={S,projId,projName,imgSrc,brandImg,bgImgSrc,undoStack,lastSnap:_lastSnap,imageGeneration:jsonImageGeneration};
        const oldId=projId||('p_'+Date.now()+'_'+Math.random().toString(36).slice(2,9));
        await idbPut('proj',{id:oldId,name:projName,data:stateOut(),updated:Date.now()});
        projId=previous.projId=oldId;
        jsonImageGeneration++;S=next;projId='p_'+Date.now()+'_'+Math.random().toString(36).slice(2,9);projName=nextName;
        imgSrc=Object.fromEntries(KEYS.map(k=>[k,null]));
        brandImg=Object.fromEntries(BKEYS.map(k=>[k,null]));bgImgSrc=null;
        undoStack=[];_lastSnap=0;
        try{
          $('projname').value=projName;render();buildPanel();
          await idbPut('proj',{id:projId,name:projName,data:stateOut(),updated:Date.now()});
        }catch(err){
          S=previous.S;projId=previous.projId;projName=previous.projName;
          imgSrc=previous.imgSrc;brandImg=previous.brandImg;bgImgSrc=previous.bgImgSrc;
          undoStack=previous.undoStack;_lastSnap=previous.lastSnap;jsonImageGeneration=previous.imageGeneration;
          $('projname').value=projName;render();buildPanel();throw err;
        }
        [...Object.values(previous.imgSrc),...Object.values(previous.brandImg),previous.bgImgSrc].forEach(src=>{if(src&&src.url)URL.revokeObjectURL(src.url);});
        toast('已导入配置（图片需重新上传）');

      finally{jsonImportBusy=false;}

  };

}

/* ===== 十一、导出 PNG 1200×1600（与预览完全一致） ===== */
function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r||0,w/2,h/2);
  ctx.beginPath();
  if(!r){ ctx.rect(x,y,w,h); return; }
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function loadImageEl(url){ return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url;}); }
async function doExport(){
  const btn=$('btnexp'); btn.disabled=true; btn.textContent='导出中…';
  try{
    if(!await wpCheckExportQuota()) return;
    await document.fonts.ready;                       // 规则 1
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const ctx=cv.getContext('2d');
    ctx.fillStyle=S.bg; ctx.fillRect(0,0,W,H);
    /* 画布底图层：与预览同一张纹理 canvas / 同一个 iLay 结果 */
    const bgm=S.bgimg||{};
    if(bgm.mode&&bgm.mode!=='none'){
      ctx.save(); ctx.globalAlpha=(bgm.op==null?1:bgm.op);
      if(bgm.mode==='upload'){
        if(bgImgSrc){
          const im=await loadImageEl(bgImgSrc.url);
          const g=iLay(bgImgSrc.nw,bgImgSrc.nh,W,H,bgm.zoom||1,bgm.px==null?50:bgm.px,bgm.py==null?50:bgm.py);
          ctx.drawImage(im,g.left,g.top,g.width,g.height);
        }
      }else ctx.drawImage(makeTexture(bgm.mode,S.bg),0,0);
      ctx.restore();
    }
    const R=slotRects();
    for(const k of KEYS){
      const r=R[k]; if(!r) continue;
      const src=imgSrc[k];
      ctx.save(); roundRect(ctx,r.x,r.y,r.w,r.h,r.r||0); ctx.clip();
      if(src){
        const im=await loadImageEl(src.url);
        const g=iLay(src.nw,src.nh,r.w,r.h,S.imgs[k].zoom,S.imgs[k].px,S.imgs[k].py);   // 与预览同一函数
        if(r.op!=null) ctx.globalAlpha=r.op;                 // 图位透明度（与预览 opacity 一致）
        if(r.blur) ctx.filter='blur('+r.blur+'px)';          // 图位柔化（与预览 filter 一致）
        ctx.drawImage(im,r.x+g.left,r.y+g.top,g.width,g.height);
        ctx.filter='none'; ctx.globalAlpha=1;
      }else if(!r.opt){ ctx.fillStyle='#dcdcdc'; ctx.fillRect(r.x,r.y,r.w,r.h); }
      /* r.opt 的空图位：导出不画任何占位 */
      ctx.restore();
    }
    decor().forEach(d=>{
      ctx.save();
      if(d.rot){ const cx0=d.x+d.w/2, cy0=d.y+d.h/2; ctx.translate(cx0,cy0); ctx.rotate(d.rot*Math.PI/180); ctx.translate(-cx0,-cy0); }
      if(d.type==='grad'){
        const gr = d.dir==='h' ? ctx.createLinearGradient(d.x,d.y,d.x+d.w,d.y) : ctx.createLinearGradient(d.x,d.y,d.x,d.y+d.h);
        d.stops.forEach(s=>gr.addColorStop(clamp(s[0]/100,0,1),s[1]));
        ctx.fillStyle=gr; roundRect(ctx,d.x,d.y,d.w,d.h,d.r||0); ctx.fill();
      }else if(d.type==='stroke'){
        ctx.strokeStyle=d.color; ctx.lineWidth=d.lw||2;
        roundRect(ctx,d.x,d.y,d.w,d.h,d.r||0); ctx.stroke();
      }else{
        ctx.fillStyle=d.fill; roundRect(ctx,d.x,d.y,d.w,d.h,d.r||0); ctx.fill();
      }
      ctx.restore();
    });
    const drawTxt=t=>{
      if(!t.s) return;
      const P=txtPos(t);
      ctx.save();
