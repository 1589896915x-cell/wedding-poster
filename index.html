<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>婚礼海报设计工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;}
/* ── 过渡动画 ── */
.screen{opacity:1;}
.screen.hidden{display:none!important;}
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:linear-gradient(135deg,#0a0a0a 0%,#1a1208 100%);}
.login-box{background:#111;border:1px solid #2a2a2a;border-radius:16px;padding:48px 40px;width:100%;max-width:400px;text-align:center;}
.login-logo{font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:400;letter-spacing:.12em;color:#c8a96a;margin-bottom:6px;}
.login-sub{font-size:11px;color:#555;letter-spacing:.08em;margin-bottom:36px;}
.login-label{font-size:11px;color:#888;text-align:left;margin-bottom:6px;}
.login-input{width:100%;padding:12px 14px;background:#0a0a0a;border:1px solid #333;border-radius:8px;color:#fff;font-size:14px;font-family:inherit;outline:none;letter-spacing:.05em;margin-bottom:14px;}
.login-input:focus{border-color:#c8a96a;}
.login-btn{width:100%;padding:13px;background:#c8a96a;color:#0a0a0a;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.05em;transition:background .15s;}
.login-btn:hover{background:#d4b87a;}
.login-btn:disabled{background:#3a3020;color:#665a3a;cursor:default;}
.login-err{font-size:12px;color:#e05a5a;margin-top:10px;min-height:18px;}
.login-hint{font-size:10px;color:#444;margin-top:20px;line-height:1.6;}
#home-screen{display:flex;flex-direction:column;min-height:100vh;}
.header{padding:22px 40px;border-bottom:1px solid #1e1e1e;display:flex;align-items:center;justify-content:space-between;}
.header-logo{font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:400;letter-spacing:.12em;color:#c8a96a;}
.header-right{display:flex;align-items:center;gap:12px;font-size:11px;color:#555;}
.credits-badge{background:#1e1e1e;padding:4px 12px;border-radius:4px;color:#c8a96a;font-size:11px;}
.logout-btn{padding:5px 14px;border:1px solid #2a2a2a;border-radius:5px;background:none;color:#666;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s;}
.logout-btn:hover{border-color:#555;color:#aaa;}
.home-body{padding:40px;}
.page-title{font-family:Georgia,'Times New Roman',serif;font-size:30px;font-weight:300;letter-spacing:.06em;color:#ddd;margin-bottom:6px;}
.page-desc{font-size:12px;color:#555;margin-bottom:36px;}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;}
.tpl-card{background:#111;border:1px solid #2a2a2a;border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s;text-decoration:none;display:block;}
.tpl-card:hover{border-color:#c8a96a;transform:translateY(-4px);box-shadow:0 16px 48px rgba(200,169,106,.15);}
.tpl-preview{aspect-ratio:3/4;position:relative;overflow:hidden;background:#0a0a0a;}
.tpl-preview-hint{display:grid;place-items:center;width:100%;height:100%;color:#777;font-size:13px;}
.tpl-preview img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease;display:block;}
.tpl-card:hover .tpl-preview img{transform:scale(1.04);}
.tpl-info{padding:14px 16px;border-top:1px solid #1e1e1e;}
.tpl-name{font-size:14px;font-weight:500;color:#ddd;margin-bottom:3px;}
.tpl-desc{font-size:11px;color:#555;line-height:1.5;}
.tpl-tag{display:inline-block;padding:2px 8px;background:#1e1e1e;border-radius:3px;font-size:9px;color:#888;margin-top:5px;letter-spacing:.05em;}
/* 骨架屏 */
.skeleton{background:linear-gradient(90deg,#1a1a1a 25%,#222 50%,#1a1a1a 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:14px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>

<div id="login-screen" class="screen">
  <div class="login-box">
    <div class="login-logo">WEDDING POSTER</div>
    <div class="login-sub">婚礼海报设计工具</div>
    <div class="login-label">请输入卡密</div>
    <input class="login-input" id="login-input" type="text" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" id="login-btn" onclick="doLogin()">进入系统</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-hint">请联系管理员获取卡密<br>次数永久有效，用完充值即可继续</div>
  </div>
</div>

<div id="home-screen" class="screen hidden">
  <div class="header">
    <div class="header-logo">WEDDING POSTER</div>
    <div class="header-right">
      <span id="user-code"></span>
      <span class="credits-badge" id="wp-credits">加载中…</span>
      <button class="logout-btn" onclick="doLogout()">退出</button>

  </div>
</div>

function currentPreview(job){return previewJobs.get(job.id)===job&&job.frame.isConnected;}
function previewHint(frame,text){const hint=document.createElement('span');hint.className='tpl-preview-hint';hint.textContent=text;frame.appendChild(hint);}
function removePreviewJob(id){
  const job=previewJobs.get(id);if(!job)return;
  previewJobs.delete(id);previewObserver?.unobserve(job.frame);clearTimeout(job.retryTimer);
  if(job.cancel)job.cancel();
}
function pumpPreviews(){
  while(previewActive<PREVIEW_LIMIT&&previewQueue.length){
    const job=previewQueue.shift();job.queued=false;
    if(!currentPreview(job)||!job.near||job.done||job.cancel)continue;
    previewActive++;job.attempts++;
    let settled=false,timer=null;
    const finish=error=>{
      if(settled)return;settled=true;clearTimeout(timer);job.image.onload=job.image.onerror=null;job.cancel=null;previewActive--;
      if(error)job.image.removeAttribute('src');
      if(currentPreview(job)){
        if(!error){job.done=true;previewObserver?.unobserve(job.frame);}
        else if(error!=='cancel'&&job.attempts<2){job.retryTimer=setTimeout(()=>queuePreview(job),1000);}
        else if(error!=='cancel'){job.done=true;previewObserver?.unobserve(job.frame);job.frame.textContent='';previewHint(job.frame,'预览暂时无法加载');}
      }
      pumpPreviews();
    };
    job.cancel=()=>finish('cancel');job.image.onload=()=>finish();job.image.onerror=()=>finish('error');
    timer=setTimeout(()=>finish('timeout'),PREVIEW_TIMEOUT);
    let src=job.src;
    if(job.attempts>1){try{const u=new URL(src,location.href);if(u.hostname==='1589896915x-cell.github.io'){u.searchParams.set('_retry',String(Date.now()));src=u.href;}}catch(e){}}
    job.image.src=src;
  }
}
function queuePreview(job){
  if(!currentPreview(job)||!job.near||job.done||job.cancel||job.queued)return;
  job.queued=true;previewQueue.push(job);pumpPreviews();
}
function scanPreviews(){
  for(const job of previewJobs.values()){
    if(job.done||!currentPreview(job))continue;
    const r=job.frame.getBoundingClientRect();job.near=r.width>0&&r.height>0&&r.bottom>=-PREVIEW_MARGIN&&r.top<=innerHeight+PREVIEW_MARGIN;
    if(job.near)queuePreview(job);
  }
}
function observePreview(job){
  if('IntersectionObserver' in window){
    if(!previewObserver)previewObserver=new IntersectionObserver(entries=>{
      for(const entry of entries){const job=previewJobs.get(entry.target.dataset.previewId);if(!job||job.frame!==entry.target)continue;job.near=entry.isIntersecting;if(job.near)queuePreview(job);}
    },{rootMargin:PREVIEW_MARGIN+'px 0px'});
    job.frame.dataset.previewId=job.id;previewObserver.observe(job.frame);
  }else{
    if(!observePreview.fallback){let scheduled=false;const scan=()=>{if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;scanPreviews();});};window.addEventListener('scroll',scan,{passive:true});window.addEventListener('resize',scan);observePreview.fallback=true;}
    scanPreviews();
  }
}
function installImage(card,t,src){
  const frame=card.querySelector('.tpl-preview');if(!frame)return;
  const id=rowId(t),safe=safeImage(src);removePreviewJob(id);imageGenerations.set(id,(imageGenerations.get(id)||0)+1);
  frame.textContent='';
  if(!safe){previewHint(frame,'暂无预览');return;}
  const image=document.createElement('img');image.loading='eager';image.decoding='async';image.alt=t.name||'模板预览';
  frame.appendChild(image);
  const job={id,frame,image,src:safe,near:false,done:false,queued:false,attempts:0,cancel:null,retryTimer:null};
  previewJobs.set(id,job);observePreview(job);
}
function showImage(id,src,opts={}){
  id=String(id);const row=catalogRows.find(t=>rowId(t)===id);if(!row)return;
  const safe=safeImage(row.__localPreset?row.img:src);const old=imageById.get(id)||'';
  if(opts.onlyIfEmpty&&old)return;
  if(old===safe&&document.querySelector('.tpl-card[data-template-id="'+CSS.escape(id)+'"] .tpl-preview img'))return;
  imageById.set(id,safe);
  const card=document.querySelector('.tpl-card[data-template-id="'+CSS.escape(id)+'"]');if(card)installImage(card,row,safe);
}
// Local presets are published with the site, never persisted back to the remote catalog.
function localTemplatePresets(){
  const source=Array.isArray(window.LOCAL_TEMPLATE_PRESETS)?window.LOCAL_TEMPLATE_PRESETS:[],seen=new Set(),rows=[];
  for(const item of source){
    if(!item||typeof item!=='object'||item.is_active===false||typeof item.url!=='string'||!item.url)continue;
    const id=String(item.id??'').trim();if(!id||/^\d+$/.test(id)||seen.has(id))continue;
    seen.add(id);rows.push({...item,id,__localPreset:true});
  }
  return rows;
}
function mergedTemplateRows(remoteRows){
  const rows=localTemplatePresets(),seen=new Set(rows.map(rowId));
  for(const row of remoteRows||[]){if(!row||row.__localPreset||seen.has(rowId(row)))continue;seen.add(rowId(row));rows.push(row);}
  return rows;
}
function rowSignature(rows){return JSON.stringify((rows||[]).map(t=>[rowId(t),t.name,t.url,t.description,t.tag,t.__localPreset?t.img:undefined]));}
function renderTemplates(rows){
  rows=mergedTemplateRows(rows);
  const grid=document.getElementById('tpl-grid');const same=catalogRows.length>0&&rowSignature(catalogRows)===rowSignature(rows);catalogRows=rows;
  for(const row of catalogRows)if(row.__localPreset)imageById.set(rowId(row),safeImage(row.img));
  if(same)return;
  previewQueue=[];for(const id of previewJobs.keys())removePreviewJob(id);
  if(!catalogRows.length){grid.innerHTML='<div style="color:#888;font-size:12px;">暂无模板</div>';return;}
  grid.innerHTML=catalogRows.map(t=>`<a class="tpl-card" data-template-id="${esc(rowId(t))}" href="${esc(normalizeCatalogURL(t.url||'#'))}">
    <div class="tpl-preview"></div><div class="tpl-info"><div class="tpl-name">${esc(t.name)}</div>
    <div class="tpl-desc">${esc(t.description||'')}</div>${t.tag?`<div class="tpl-tag">${esc(t.tag)}</div>`:''}</div></a>`).join('');
  for(const row of catalogRows){const id=rowId(row);const card=document.querySelector('.tpl-card[data-template-id="'+CSS.escape(id)+'"]');installImage(card,row,imageById.get(id)||'');}
}
function saveCatalog(){
  try{const data=catalogRows.filter(t=>!t.__localPreset).map(t=>{const src=imageById.get(rowId(t))||'';return {...t,img:src&&!src.startsWith('data:')?src:undefined};});localStorage.setItem('wp_tpl_cache',JSON.stringify({ts:Date.now(),data}));}catch(e){}
}
async function queryCatalog(query,signal,timeoutMs=10000){
  const controller=new AbortController();const abort=()=>controller.abort();
  if(signal?.aborted)abort();else signal?.addEventListener('abort',abort,{once:true});
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{const r=await fetch(SB_URL+'/rest/v1/templates?'+query,{...SB_HDR,signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json();}
  catch(e){if(controller.signal.aborted&&!signal?.aborted)throw Error('请求超时');throw e;}
  finally{clearTimeout(timer);signal?.removeEventListener('abort',abort);}
}
async function queryWithRetry(query,signal,timeoutMs){try{return await queryCatalog(query,signal,timeoutMs);}catch(e){if(e.name==='AbortError'||signal?.aborted)throw e;return await queryCatalog(query,signal,timeoutMs);}}
async function sha256DataURI(src){
  if(!globalThis.crypto?.subtle)return '';
  const bytes=Uint8Array.from(atob(src.slice(src.indexOf(',')+1)),c=>c.charCodeAt(0));
  const hash=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');
}
async function refreshLegacyInBackground(signal){
  const stored=await readStoredPreviews();
  const cachedInline=new Set(stored.filter(s=>(s.src||'').startsWith('data:image/')).map(s=>String(s.id)));
  const ids=catalogRows.filter(t=>!t.__localPreset&&(previewFallback(t)||cachedInline.has(rowId(t)))).map(rowId).filter(x=>/^\d+$/.test(x));if(!ids.length)return;
  let last=0;try{last=Number(localStorage.getItem(LEGACY_CHECK_KEY)||0);}catch(e){}
  if(Date.now()-last<LEGACY_CHECK_INTERVAL)return;
  try{
    const rows=await queryWithRetry('is_active=eq.true&id=in.('+ids.join(',')+')&select=id,img',signal,30000);if(signal?.aborted)return;const changes=[];
    for(const row of rows){if(signal?.aborted)return;const id=String(row.id),value=row.img||'',known=LEGACY_PREVIEWS[id];
      if(value.startsWith('data:image/')){
        const digest=await sha256DataURI(value);if(digest&&digest===known?.[1]){changes.push({id,src:'',sameAsStatic:true});const row=catalogRows.find(t=>rowId(t)===id);if(row)showImage(id,previewFallback(row));continue;}
        changes.push({id,src:value});showImage(id,value);
      }else if(value){changes.push({id,src:value});showImage(id,value);}
      else {changes.push({id,src:'',empty:true});showImage(id,'');}
    }
    if(await writeStoredPreviews(changes)){try{localStorage.setItem(LEGACY_CHECK_KEY,String(Date.now()));}catch(e){}}
    saveCatalog();
  }catch(e){/* 现有缓存和静态图继续显示，下次再验证。 */}
}
function scheduleLegacyVerification(){
  let timer=null,controller=null,done=false;
  const cleanup=()=>{done=true;clearTimeout(timer);window.removeEventListener('scroll',reset);document.removeEventListener('visibilitychange',reset);};
  const reset=()=>{
    clearTimeout(timer);if(controller){controller.abort();controller=null;}
    if(done||document.visibilityState==='hidden')return;
    timer=setTimeout(async()=>{
      const active=new AbortController();controller=active;
      try{await refreshLegacyInBackground(active.signal);}finally{if(controller===active){controller=null;cleanup();}}
    },60000);
  };
  window.addEventListener('scroll',reset,{passive:true});document.addEventListener('visibilitychange',reset);reset();
}
// Called explicitly by the login flow after SB_URL/SB_HDR exist. No rendering or image downloads here.
let catalogPreload=null;
function preloadTemplates(){
  if(!catalogPreload){
    const metadata=queryWithRetry('is_active=eq.true&order=sort_order.asc&select=id,name,url,description,tag,sort_order').then(data=>({data}),error=>({error}));
    const urls=queryWithRetry('is_active=eq.true&img=not.like.data:*&select=id,img').catch(()=>null);
    catalogPreload={metadata,urls,ready:Promise.all([metadata,urls]).then(()=>undefined)};
  }
  return catalogPreload.ready;
}
async function loadTemplates(){
  let hadCache=false, cached=[];
  try{const parsed=JSON.parse(localStorage.getItem('wp_tpl_cache')||'null');if(Array.isArray(parsed?.data))cached=parsed.data;}catch(e){}
  if(cached.length||localTemplatePresets().length){
    for(const t of cached){const src=safeImage(t.img)||previewFallback(t);if(src)imageById.set(rowId(t),src);}
    renderTemplates(cached);hadCache=true;
  }else showSkeletons();
  // 图片 URL 请求与轻量列表并行；旧版内嵌图不进入首屏请求。
  preloadTemplates();const preloaded=catalogPreload;
  const urlPromise=preloaded.urls;
  const storedPromise=readStoredPreviews();
  try{
    const result=await preloaded.metadata;if(result.error)throw result.error;const fresh=result.data;
    if(!Array.isArray(fresh))throw Error('invalid list');
    const active=new Set(fresh.map(rowId));for(const id of imageById.keys())if(!active.has(id))imageById.delete(id);
    for(const t of fresh){const id=rowId(t);if(!imageById.get(id)){const src=previewFallback(t);if(src)imageById.set(id,src);}}
    renderTemplates(fresh);saveCatalog();
  }catch(e){if(!hadCache){if(catalogPreload===preloaded)catalogPreload=null;document.getElementById('tpl-grid').innerHTML='<div style="color:#e05a5a;font-size:12px;">模板加载失败，请刷新重试</div>';return;}}
  const stored=await storedPromise;
  for(const item of stored){if(item.sameAsStatic){const row=catalogRows.find(t=>rowId(t)===String(item.id));if(row)showImage(item.id,previewFallback(row));}else showImage(item.id,item.src||'');}
  const remote=await urlPromise;
  if(Array.isArray(remote))for(const item of remote)if(item.img)showImage(item.id,item.img);
  // 未登记的新模板仅按缺失 id 批量读取 img：URL、内嵌图片和 null 均适用。
  const remoteIds=new Set(Array.isArray(remote)?remote.map(x=>String(x.id)):[]);
  const storedInline=new Set(stored.filter(s=>(s.src||'').startsWith('data:image/')).map(s=>String(s.id)));
  const missing=catalogRows.filter(t=>{
    if(t.__localPreset)return false;
    const id=rowId(t),has=imageById.get(id),known=previewFallback(t);
    if(known||remoteIds.has(id))return false;
    // URL 查询成功且此 id 不在结果中：可能已改为内嵌图或移除图片。
    if(Array.isArray(remote))return !storedInline.has(id);
    return !has;
  }).map(rowId).filter(x=>/^\d+$/.test(x));
  if(missing.length){
    try{const rows=await queryWithRetry('is_active=eq.true&id=in.('+missing.join(',')+')&select=id,img');const toStore=[];
      for(const item of rows){if(item.img){showImage(item.id,item.img);if(item.img.startsWith('data:image/'))toStore.push({id:String(item.id),src:item.img});}else{showImage(item.id,'');toStore.push({id:String(item.id),src:'',empty:true});}}
      await writeStoredPreviews(toStore);
    }catch(e){}
  }
  saveCatalog();
  // 仅在页面可见且连续 60 秒没有滚动时低频复核；滚动或隐藏时取消请求。
  if(catalogPreload===preloaded)catalogPreload=null;
  scheduleLegacyVerification();
}

<script>

// ── 屏幕切换（淡入淡出，无闪烁）──────────────────────────
function showScreen(id){
  ['login-screen','home-screen'].forEach(s=>{
    const el=document.getElementById(s);
    if(s===id){el.classList.remove('hidden');}
    else{el.classList.add('hidden');}
  });

// ── 骨架屏占位 ────────────────────────────────────────────
function showSkeletons(n=6){
  const grid=document.getElementById('tpl-grid');
  grid.innerHTML=Array(n).fill(0).map(()=>`
    <div class="skeleton" style="aspect-ratio:3/4;border-radius:14px;"></div>`).join('');

let currentLic=null;
const LICENSE_TIMEOUT_MS=8000;
function validLicense(lic,code){
  if(!lic||!lic.is_active||(lic.credits||0)<=0||lic.code!==code)return false;
  if(lic.expires_at&&new Date(lic.expires_at)<new Date())return false;
  if(lic.duration_days&&lic.first_used_at){const exp=new Date(lic.first_used_at);exp.setDate(exp.getDate()+lic.duration_days);if(exp<new Date())return false;}
  return true;
}
async function requestLicense(code){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),LICENSE_TIMEOUT_MS);
  try{
    const response=await fetch(`${SB_URL}/rest/v1/licenses?code=eq.${encodeURIComponent(code)}&select=*`,{...SB_HDR,signal:controller.signal});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const rows=await response.json();if(!Array.isArray(rows))throw new Error('Invalid response');
    return rows[0]||null;
  }finally{clearTimeout(timer);}
}
function preloadCatalog(){if(typeof preloadTemplates==='function')preloadTemplates();}


// ── 登录 ──────────────────────────────────────────────────
async function doLogin(){
  const code=document.getElementById('login-input').value.trim().toUpperCase();
  if(!code){setErr('请输入卡密');return;}
  const btn=document.getElementById('login-btn');
  btn.textContent='验证中…';btn.disabled=true;setErr('');
  try{
    preloadCatalog();
    const lic=await requestLicense(code);
    if(!lic){setErr('卡密不存在');return;}
    if(!lic.is_active){setErr('卡密已停用');return;}
    if(lic.expires_at&&new Date(lic.expires_at)<new Date()){setErr('卡密已过期');return;}
    if(lic.duration_days&&lic.first_used_at){
      const exp=new Date(lic.first_used_at);exp.setDate(exp.getDate()+lic.duration_days);
      if(exp<new Date()){setErr(`卡密已过期（有效期${lic.duration_days}天）`);return;}
    }
    if((lic.credits||0)<=0){setErr('导出次数已用完，请联系管理员充值');return;}
    if(!lic.first_used_at){
      fetch(`${SB_URL}/rest/v1/licenses?id=eq.${lic.id}`,{method:'PATCH',headers:{...SB_HDR.headers,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({first_used_at:new Date().toISOString()})});
      lic.first_used_at=new Date().toISOString();
    }
    currentLic=lic;
    localStorage.setItem('wp-license',code);
    // 缓存 license 避免下次页面加载再请求
    localStorage.setItem('wp-lic-cache',JSON.stringify({ts:Date.now(),lic}));
    enterHome();
  }catch(e){setErr(e.name==='AbortError'?'验证超时，请重试':'网络连接失败，请重试');}
  finally{btn.textContent='进入系统';btn.disabled=false;}
}
function setErr(msg){document.getElementById('login-err').textContent=msg;}

// ── 校验已保存卡密（优先用本地缓存，后台静默刷新）─────
async function checkSaved(){
  const code=localStorage.getItem('wp-license');
  if(!code)return false;

  // 先尝试本地缓存（2分钟内有效），快速进入首页
  const raw=localStorage.getItem('wp-lic-cache');
  if(raw){
    try{
      const {ts,lic}=JSON.parse(raw);
      if(Date.now()-ts>=0&&Date.now()-ts<2*60*1000&&validLicense(lic,code)){
        currentLic=lic;
        // 后台静默刷新
        refreshLicInBackground(code);
        return true;
      }
    }catch(e){}
  }

  // 缓存过期，正常请求
  try{
    const lic=await requestLicense(code);
    if(!validLicense(lic,code)){setErr('登录已失效，请重新验证卡密');return false;}
    if(lic.expires_at&&new Date(lic.expires_at)<new Date())return false;
    if(lic.duration_days&&lic.first_used_at){const exp=new Date(lic.first_used_at);exp.setDate(exp.getDate()+lic.duration_days);if(exp<new Date())return false;}
    currentLic=lic;
    localStorage.setItem('wp-lic-cache',JSON.stringify({ts:Date.now(),lic}));
    return true;
  }catch(e){setErr(e.name==='AbortError'?'验证超时，请点击进入系统重试':'网络连接失败，请点击进入系统重试');return false;}
}

function refreshLicInBackground(code){
  requestLicense(code).then(lic=>{
    if(localStorage.getItem('wp-license')!==code)return;
    if(!validLicense(lic,code)){
      currentLic=null;localStorage.removeItem('wp-lic-cache');
      showScreen('login-screen');setErr('登录已失效，请重新验证卡密');return;
    }
    currentLic=lic;
    localStorage.setItem('wp-lic-cache',JSON.stringify({ts:Date.now(),lic}));
    document.getElementById('wp-credits').textContent=`剩余 ${lic.credits||0} 次`;
  }).catch(()=>{});
}

// ── 退出（无系统弹窗，直接退出）──────────────────────────
function doLogout(){
  localStorage.removeItem('wp-license');
  localStorage.removeItem('wp-lic-cache');
  localStorage.removeItem('wp_tpl_cache');
  currentLic=null;
  document.getElementById('login-input').value='';
  setErr('');
  showScreen('login-screen');
}

// ── 进入首页 ──────────────────────────────────────────────
function enterHome(){
  document.getElementById('user-code').textContent=currentLic?.code||localStorage.getItem('wp-license')||'';
  document.getElementById('wp-credits').textContent=`剩余 ${currentLic?.credits||0} 次`;
  showScreen('home-screen');
  loadTemplates();
}

// ── 初始化：同步检查缓存，避免闪登录页 ────────────────
(async()=>{
  // 先同步读本地缓存，有效则直接显示首页（无闪烁）
  const code=localStorage.getItem('wp-license');
  const raw=localStorage.getItem('wp-lic-cache');
  let fastPass=false;
  if(code&&raw){
    try{
      const {ts,lic}=JSON.parse(raw);
      if(Date.now()-ts>=0&&Date.now()-ts<2*60*1000&&validLicense(lic,code)){
        currentLic=lic;
        fastPass=true;
      }
    }catch(e){}
  }
  if(code)preloadCatalog();
  if(fastPass){
    // 有缓存：直接进首页，后台静默刷新
    enterHome();
    refreshLicInBackground(code);
  }else{
    // 无缓存：显示登录页，后台验证
    showScreen('login-screen');
    const btn=document.getElementById('login-btn');
    if(code){document.getElementById('login-input').value=code;btn.disabled=true;btn.textContent='正在验证登录…';}
    try{const ok=await checkSaved();if(ok)enterHome();}
    finally{btn.disabled=false;btn.textContent='进入系统';}
  }
})();
