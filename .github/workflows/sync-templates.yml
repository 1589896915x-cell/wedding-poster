name: Sync Templates to Supabase

on:
  push:
    branches: [main]
    paths:
      - '[0-9]*.html'
      - 'template-*.html'
  workflow_dispatch:
    inputs:
      files:
        description: '仅允许63.html至76.html，以空格分隔；重复或范围外文件将失败'
        required: true
        type: string
        default: '63.html 64.html 65.html 66.html 67.html 68.html 69.html 70.html 71.html 72.html 73.html 74.html 75.html 76.html'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync changed templates to Supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          SYNC_EVENT_NAME: ${{ github.event_name }}
          SYNC_REQUESTED_FILES: ${{ inputs.files }}
        run: python3 .github/scripts/sync_templates.py
